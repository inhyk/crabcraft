name: World network foundation
on:
  pull_request:
    branches: [dev]
    paths:
      - 'server/world/**'
      - 'tools/load-world.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - '.github/workflows/world-network.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  world-network:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:world
      - run: node tools/load-world.mjs --seconds 10 > world-load.json
      - run: node -e "const r=require('./world-load.json'); if(!r.cleanup.exactTotalsMatched) process.exit(1)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-world-network-load
          path: world-load.json
