# Builds the game (and the Node server once `pnpm build:server` exists) and ships it to the
# crabcraft-1 VM: push to dev -> https://crab-dev.seonn.dev, push to main ->
# https://crab.seonn.dev. The VM side lives in deploy/vm/ (activate.sh, Caddyfile, units).
name: Deploy

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref_name == 'main' && 'prod' || 'dev' }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DEPLOY_ENV: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      SITE: ${{ github.ref_name == 'main' && 'crab.seonn.dev' || 'crab-dev.seonn.dev' }}
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: pnpm/action-setup@v6
        with:
          version: 10.10.0
          cache: true

      - run: pnpm install --frozen-lockfile

      - name: Verify collision bake before release
        if: ${{ hashFiles('tools/bake-collision.mjs') != '' }}
        run: node tools/bake-collision.mjs --check

      # The title screen shows this build's version (src/version.ts). Browser build only: the
      # server bundle must not change with every commit, or activate.sh restarts it on every deploy.
      - name: Build the game
        env:
          VITE_DEPLOY_ENV: ${{ env.DEPLOY_ENV }}
          VITE_GIT_SHA: ${{ github.sha }}
        run: VITE_APP_VERSION="$(node -p "require('./package.json').version")" pnpm build

      - name: Build the server (when the repo has one)
        run: |
          if node -e "process.exit(require('./package.json').scripts?.['build:server'] ? 0 : 1)"; then
            pnpm build:server
            test -f server-dist/main.mjs
          else
            echo "no build:server script; this release is static only"
          fi

      - run: pnpm test:multiplayer

      - name: Stage the release
        run: |
          mkdir release
          mv dist release/dist
          node -e "const v=require('./package.json').version;console.log(JSON.stringify({version:v,env:process.env.DEPLOY_ENV,commit:process.env.SHA}))" > release/dist/version.json
          if [ -d server-dist ]; then mv server-dist release/server-dist; fi
          du -sh release/*

      - name: SSH key
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VM_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload to releases/${{ github.sha }}
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          # --link-dest reuses unchanged files from the live release on the VM, so only what
          # changed crosses the network. Checksums, not mtimes: the runner's files are all new.
          rsync -rlc --delete --chmod=D755,F644 \
            --link-dest="/srv/crabcraft/$DEPLOY_ENV/current/" \
            -e "ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes" \
            release/ "deploy@$VM_HOST:/srv/crabcraft/$DEPLOY_ENV/releases/$SHA/"

      - name: Activate
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "deploy@$VM_HOST" "sudo /srv/crabcraft/bin/activate.sh $DEPLOY_ENV $SHA"

      - name: Smoke test https://${{ env.SITE }}
        run: |
          for i in $(seq 1 10); do
            if curl -fsS -o /dev/null -D headers.txt "https://$SITE/"; then break; fi
            sleep 6
          done
          cat headers.txt
          grep -qi '^cross-origin-opener-policy: same-origin' headers.txt
          grep -qi '^cross-origin-embedder-policy: require-corp' headers.txt
          curl -fsS "https://$SITE/" | cmp - release/dist/index.html
          curl -fsS "https://$SITE/version.json" | cmp - release/dist/version.json
          if [ -d release/server-dist ]; then curl -fsS "https://$SITE/healthz"; fi

      - name: Remove the SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

  # After a successful main deploy, tag the commit v<package.json version> (AGENTS.md 버전과 릴리스).
  # A tag that already sits on another commit means the release went out without a version bump.
  tag-release:
    name: Tag the release (main)
    if: github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create v<version> if missing
        run: |
          set -euo pipefail
          TAG="v$(node -p "require('./package.json').version")"
          git fetch --tags --quiet
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            TAG_SHA=$(git rev-list -n 1 "$TAG")
            if [ "$TAG_SHA" = "$GITHUB_SHA" ]; then echo "$TAG already points at $GITHUB_SHA"; exit 0; fi
            echo "::error::$TAG already exists at $TAG_SHA but main is $GITHUB_SHA: this release did not bump package.json. Run node tools/release-version.mjs --bump on dev before the next release."
            exit 1
          fi
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
          echo "tagged $TAG at $GITHUB_SHA"
