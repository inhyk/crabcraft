name: Simulation core

on:
  pull_request:
    branches: [dev]
  push:
    branches: [feat/s2-sim-core-20261018]

permissions:
  contents: read

concurrency:
  group: sim-core-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  numeric-simulation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
        with:
          version: 10.10.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:sim:core
      - run: pnpm build
      - run: pnpm build:server
      - run: pnpm test:boss
      - run: pnpm test:engine
      - run: pnpm test:multiplayer
      - run: pnpm test:server
