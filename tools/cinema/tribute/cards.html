<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Tribute cards</title>
<!--
  The tribute's 2D cards, drawn on a canvas as a pure function of song time: the rating card, the
  parchment map of the six worlds and the logo. tools/cinema/tribute/cards.mjs opens this page on the
  dev server, hands it the islands (tools/cinema/tribute/islands.mjs: the worlds' real ground heights)
  and records frames with renderAt(t). The map's islands are the sampled worlds, coastlines warped a
  little so they read as an old drawn map; Clawhaven keeps its real east coast and voyage islands.
-->
<style>
  @font-face { font-family: 'Cinzel'; font-weight: 400 900; src: url('/fonts/cinzel-latin-wght.woff2') format('woff2'); }
  html, body { margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="872"></canvas>
<script type="module">
const W = 1920, H = 872;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const MW = 4400, MH = 2000;
const KO = '"AppleMyungjo", "Apple SD Gothic Neo", serif';

// ----------------------------------------------------------------------------------- helpers
const clamp01 = (x) => (x < 0 ? 0 : x > 1 ? 1 : x);
const smooth = (x) => { x = clamp01(x); return x * x * (3 - 2 * x); };
const lerp = (a, b, k) => a + (b - a) * k;
const ramp = (t, a, b) => smooth((t - a) / (b - a));
function mulberry(seed) { let a = seed >>> 0; return () => { a = (a + 0x6d2b79f5) >>> 0; let x = a; x = Math.imul(x ^ (x >>> 15), x | 1); x ^= x + Math.imul(x ^ (x >>> 7), x | 61); return ((x ^ (x >>> 14)) >>> 0) / 4294967296; }; }
function canvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
const img = (src) => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });

// Value noise and fbm on a lattice (seeded), for coast warps and textures.
function makeNoise(seed) {
  const r = mulberry(seed); const P = new Float32Array(256 * 256); for (let i = 0; i < P.length; i++) P[i] = r();
  const at = (x, y) => P[((y & 255) << 8) | (x & 255)];
  const n = (x, y) => { const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi; const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
    return lerp(lerp(at(xi, yi), at(xi + 1, yi), u), lerp(at(xi, yi + 1), at(xi + 1, yi + 1), u), v); };
  return (x, y, oct = 4) => { let s = 0, a = 0.5, f = 1; for (let i = 0; i < oct; i++) { s += a * n(x * f, y * f); f *= 2.03; a *= 0.5; } return s; };
}

// ----------------------------------------------------------------------------------- the map
// Island placement in map space: centre, scale (px per world unit), rotation, coast warp, label.
const ISLANDS = [
  { c: 1, x: 1010, y: 1000, s: 2.75, rot: 0, warp: 30, seed: 11, name: '클로헤이븐', sub: [['달샘 숲', -80, 50], ['철의 난파선', 150, 115], ['솔트미어 등대', 190, -132], ['소금물 해안', 120, 40]] },
  { c: 4, x: 3150, y: 470, s: 1.85, rot: -0.25, warp: 46, seed: 41, sx: 1.25, sy: 0.85, name: '서리빛 설원', glyph: 'pine' },
  { c: 2, x: 3860, y: 840, s: 1.7, rot: 0.5, warp: 42, seed: 21, sx: 0.9, sy: 1.15, name: '잊힌 별의 섬', glyph: 'crystal' },
  { c: 3, x: 3080, y: 1140, s: 1.8, rot: 1.1, warp: 48, seed: 31, sx: 1.1, sy: 0.8, name: '새벽 항구', glyph: 'hill' },
  { c: 6, x: 3820, y: 1480, s: 1.65, rot: -0.7, warp: 50, seed: 61, sx: 1.2, sy: 0.9, name: '하늘숲', glyph: 'tree' },
  { c: 5, x: 3000, y: 1730, s: 1.4, rot: 2.2, warp: 52, seed: 51, sx: 1.3, sy: 0.75, name: '잿불 군도', glyph: 'volcano' },
];
const SWIRL = { x: 2050, y: 960, r: 430 };

let MAP = null, SWIRL_C = null, LOGO = null, LOGO_NOISE = null;

function islandMask(def, data) {
  // A mask canvas in map space for one world: sample its heights at warped positions.
  const d = data[def.c]; const n = d.n; const h = d.h;
  const noise = makeNoise(def.seed);
  const half = (d.n - 1) * d.step / 2;
  const size = Math.ceil(2 * half * def.s * Math.max(def.sx ?? 1, def.sy ?? 1) * 1.15);
  const c = canvas(size, size); const g = c.getContext('2d'); const id = g.createImageData(size, size); const px = id.data;
  const cos = Math.cos(def.rot), sin = Math.sin(def.rot);
  // Clawhaven: the real coast is east; the sampled square is all land to the west, so a noisy
  // ellipse gives the continent its west and north/south shores.
  for (let j = 0; j < size; j++) for (let i = 0; i < size; i++) {
    let u = (i - size / 2) / def.s, v = (j - size / 2) / def.s;
    const ru = (u * cos + v * sin) / (def.sx ?? 1), rv = (-u * sin + v * cos) / (def.sy ?? 1);
    const wu = ru + (noise(ru * 0.02, rv * 0.02) - 0.5) * def.warp * 2 + (noise(ru * 0.08 + 9, rv * 0.08) - 0.5) * def.warp * 0.6;
    const wv = rv + (noise(ru * 0.02 + 5, rv * 0.02 + 3) - 0.5) * def.warp * 2 + (noise(ru * 0.08, rv * 0.08 + 7) - 0.5) * def.warp * 0.6;
    const gi = Math.round((wu - d.x0) / d.step), gj = Math.round((wv - d.z0) / d.step);
    let land = gi >= 0 && gj >= 0 && gi < n && gj < n && h[gj * n + gi] > 0.02;
    if (def.c === 1) {
      // A noisy ellipse around the real east coast: Clawhaven reads as a continent.
      const ex = (wu + 25) / 215, ez = wv / 270;
      const rr = Math.sqrt(ex * ex + ez * ez) + (noise(wu * 0.006 + 3, wv * 0.006) - 0.5) * 0.7 + (noise(wu * 0.022, wv * 0.022 + 11) - 0.5) * 0.3;
      if (rr > 1) land = false;
    }
    if (land) { const k = (j * size + i) * 4; px[k] = px[k + 1] = px[k + 2] = 255; px[k + 3] = 255; }
  }
  g.putImageData(id, 0, 0);
  return { c, x: def.x - size / 2, y: def.y - size / 2, size };
}

/** Threshold a blurred alpha mask back to a crisp one (smooth coasts). */
function rethreshold(src, blur, cut, w = MW, h = MH) {
  const c = canvas(w, h); const g = c.getContext('2d');
  g.filter = `blur(${blur}px)`; g.drawImage(src, 0, 0); g.filter = 'none';
  const id = g.getImageData(0, 0, w, h); const p = id.data;
  for (let k = 3; k < p.length; k += 4) { const a = p[k] > cut ? 255 : 0; p[k] = a; p[k - 1] = p[k - 2] = p[k - 3] = 255; }
  g.putImageData(id, 0, 0);
  return c;
}
function blurred(src, blur, w = MW, h = MH) { const c = canvas(w, h); const g = c.getContext('2d'); g.filter = `blur(${blur}px)`; g.drawImage(src, 0, 0); return c; }
function tinted(mask, color, w = MW, h = MH) { const c = canvas(w, h); const g = c.getContext('2d'); g.drawImage(mask, 0, 0); g.globalCompositeOperation = 'source-in'; g.fillStyle = color; g.fillRect(0, 0, w, h); return c; }

/** A parchment-like texture: soft blotches over fine grain (map size). */
function paper(seed) {
  const nz = makeNoise(seed); const r = mulberry(seed + 1);
  const lw = 550, lh = 250; const lo = canvas(lw, lh); const lgc = lo.getContext('2d'); const ld = lgc.createImageData(lw, lh);
  for (let j = 0; j < lh; j++) for (let i = 0; i < lw; i++) { const v = 0.55 + 0.6 * (nz(i * 0.035, j * 0.035, 5) - 0.5); const k = (j * lw + i) * 4; ld.data[k] = 235 * v + 20; ld.data[k + 1] = 222 * v + 18; ld.data[k + 2] = 188 * v + 14; ld.data[k + 3] = 255; }
  lgc.putImageData(ld, 0, 0);
  const c = canvas(MW, MH); const g = c.getContext('2d'); g.imageSmoothingQuality = 'high'; g.drawImage(lo, 0, 0, MW, MH);
  const gw = 1100, gh = 500; const gr = canvas(gw, gh); const gg = gr.getContext('2d'); const gd = gg.createImageData(gw, gh);
  for (let k = 0; k < gd.data.length; k += 4) { const v = 200 + r() * 55; gd.data[k] = gd.data[k + 1] = gd.data[k + 2] = v; gd.data[k + 3] = 255; }
  gg.putImageData(gd, 0, 0);
  g.globalCompositeOperation = 'multiply'; g.globalAlpha = 0.5; g.drawImage(gr, 0, 0, MW, MH);
  return c;
}

async function buildMap(data, parchment) {
  const map = canvas(MW, MH); const g = map.getContext('2d');
  // Sea: blotchy parchment (low-frequency noise, fine grain, the game's parchment as a faint
  // overlay), toned to the old map's grey-green.
  const PAPER = paper(5);
  g.drawImage(PAPER, 0, 0, MW, MH);
  g.globalCompositeOperation = 'multiply';
  const sea = g.createLinearGradient(0, 0, MW, MH); sea.addColorStop(0, '#b9b98e'); sea.addColorStop(0.5, '#c2c09a'); sea.addColorStop(1, '#a9ad86');
  g.fillStyle = sea; g.fillRect(0, 0, MW, MH);
  g.globalAlpha = 0.35; g.drawImage(parchment, 160, 160, 704, 704, 0, 0, MW, MH); g.globalAlpha = 1;
  const r = mulberry(5);
  for (let i = 0; i < 70; i++) { // stains
    const x = r() * MW, y = r() * MH, rad = 60 + r() * 380; const gr = g.createRadialGradient(x, y, 0, x, y, rad);
    gr.addColorStop(0, `rgba(${90 + r() * 40},${80 + r() * 30},${60 + r() * 20},${0.12 + r() * 0.18})`); gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.fillRect(x - rad, y - rad, rad * 2, rad * 2);
  }
  g.globalCompositeOperation = 'source-over';

  // Land mask from every world.
  const raw = canvas(MW, MH); const rg = raw.getContext('2d');
  for (const def of ISLANDS) { const m = islandMask(def, data); rg.drawImage(m.c, m.x, m.y); }
  const land = rethreshold(raw, 3, 120);

  // Water darkens and ripples around the coasts.
  const halo = blurred(land, 46);
  g.globalCompositeOperation = 'multiply'; g.globalAlpha = 0.55; g.drawImage(tinted(halo, '#4d5a44'), 0, 0); g.globalAlpha = 1;
  g.globalCompositeOperation = 'source-over';
  for (const [grow, a] of [[18, 0.35], [40, 0.22], [70, 0.12]]) {
    const outer = rethreshold(land, grow, 30); const inner = rethreshold(land, grow, 70);
    const ring = canvas(MW, MH); const q = ring.getContext('2d'); q.drawImage(outer, 0, 0); q.globalCompositeOperation = 'destination-out'; q.drawImage(inner, 0, 0);
    g.globalAlpha = a; g.drawImage(tinted(ring, '#3a4030'), 0, 0); g.globalAlpha = 1;
  }

  // Land: gold with grain, an orange-brown rim inside the coast, relief from the parchment.
  const L = canvas(MW, MH); const lg = L.getContext('2d');
  lg.drawImage(paper(17), 0, 0, MW, MH);
  lg.globalCompositeOperation = 'multiply';
  const gold = lg.createRadialGradient(MW * 0.45, MH * 0.45, 100, MW * 0.5, MH * 0.5, MW * 0.7);
  gold.addColorStop(0, '#ffc94a'); gold.addColorStop(1, '#f39a2c');
  lg.fillStyle = gold; lg.fillRect(0, 0, MW, MH);
  const rim = blurred(land, 26);
  const rimInv = canvas(MW, MH); const ri = rimInv.getContext('2d'); ri.fillStyle = '#000'; ri.fillRect(0, 0, MW, MH); ri.globalCompositeOperation = 'destination-out'; ri.drawImage(rim, 0, 0);
  lg.globalAlpha = 1; lg.drawImage(tinted(rimInv, '#a8481a'), 0, 0);
  lg.globalCompositeOperation = 'screen';
  const shine = blurred(rethreshold(land, 40, 200), 60); lg.globalAlpha = 0.35; lg.drawImage(tinted(shine, '#fff0b0'), 0, 0); lg.globalAlpha = 1;
  lg.globalCompositeOperation = 'destination-in'; lg.drawImage(land, 0, 0);
  g.drawImage(L, 0, 0);

  // Ink coastline.
  const out = rethreshold(land, 4, 25);
  const coast = canvas(MW, MH); const cg = coast.getContext('2d'); cg.drawImage(out, 0, 0); cg.globalCompositeOperation = 'destination-out'; cg.drawImage(rethreshold(land, 2, 200), 0, 0);
  g.globalAlpha = 0.85; g.drawImage(tinted(coast, '#4a2a10'), 0, 0); g.globalAlpha = 1;

  // Glyphs: mountain chevrons on Clawhaven's interior, a mark per world.
  const ld = land.getContext('2d').getImageData(0, 0, MW, MH).data;
  const inland = (x, y, m) => { for (const [dx, dy] of [[0, 0], [m, 0], [-m, 0], [0, m], [0, -m]]) { const xx = Math.round(x + dx), yy = Math.round(y + dy); if (xx < 0 || yy < 0 || xx >= MW || yy >= MH || ld[(yy * MW + xx) * 4 + 3] < 128) return false; } return true; };
  g.strokeStyle = 'rgba(92,50,18,0.75)'; g.lineWidth = 3; g.lineCap = 'round'; g.lineJoin = 'round';
  const gr2 = mulberry(77);
  const peak = (x, y, s) => { g.beginPath(); g.moveTo(x - s, y + s * 0.6); g.lineTo(x, y - s * 0.7); g.lineTo(x + s, y + s * 0.6); g.stroke(); g.beginPath(); g.moveTo(x - s * 0.15, y - s * 0.35); g.lineTo(x + s * 0.35, y + s * 0.25); g.stroke(); };
  for (let i = 0; i < 260; i++) { const x = 380 + gr2() * 1000, y = 200 + gr2() * 1600; if (x > 1080 || !inland(x, y, 70)) continue; peak(x, y, 18 + gr2() * 12); }
  const mark = { pine: (x, y, s) => { g.beginPath(); g.moveTo(x, y - s); g.lineTo(x - s * 0.55, y + s * 0.5); g.lineTo(x + s * 0.55, y + s * 0.5); g.closePath(); g.stroke(); g.beginPath(); g.moveTo(x, y + s * 0.5); g.lineTo(x, y + s * 0.85); g.stroke(); },
    crystal: (x, y, s) => { g.beginPath(); g.moveTo(x, y - s); g.lineTo(x + s * 0.4, y); g.lineTo(x, y + s * 0.7); g.lineTo(x - s * 0.4, y); g.closePath(); g.stroke(); },
    hill: (x, y, s) => { g.beginPath(); g.arc(x, y + s * 0.4, s * 0.8, Math.PI * 1.1, Math.PI * 1.9); g.stroke(); },
    tree: (x, y, s) => { g.beginPath(); g.arc(x, y - s * 0.2, s * 0.55, 0, Math.PI * 2); g.stroke(); g.beginPath(); g.moveTo(x, y + s * 0.35); g.lineTo(x, y + s * 0.9); g.stroke(); },
    volcano: (x, y, s) => { peak(x, y, s); g.beginPath(); g.moveTo(x - s * 0.2, y - s * 0.9); g.quadraticCurveTo(x, y - s * 1.6, x + s * 0.3, y - s * 1.3); g.stroke(); } };
  for (const def of ISLANDS) {
    if (!def.glyph) continue;
    const r3 = mulberry(def.seed * 13);
    for (let i = 0; i < 40; i++) { const x = def.x + (r3() - 0.5) * 520, y = def.y + (r3() - 0.5) * 520; if (!inland(x, y, 40)) continue; mark[def.glyph](x, y, 16 + r3() * 8); }
  }

  // Labels.
  const label = (text, x, y, size, weight = 'bold') => {
    g.font = `${weight} ${size}px ${KO}`; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillStyle = 'rgba(255,236,190,0.55)'; g.fillText(text, x + 2, y + 2);
    g.fillStyle = 'rgba(38,22,10,0.92)'; g.fillText(text, x, y);
  };
  const w1 = ISLANDS[0];
  label(w1.name, w1.x - 150, w1.y - 60, 92);
  for (const [name, wx, wz] of w1.sub) {
    const x = w1.x + wx * w1.s, y = w1.y + wz * w1.s;
    g.fillStyle = 'rgba(38,22,10,0.9)'; g.font = `bold 40px ${KO}`; g.fillText('+', x, y);
    label(name, x - 20 - name.length * 17, y + 2, 34, 'normal');
  }
  for (const def of ISLANDS.slice(1)) label(def.name, def.x, def.y, 64);
  label('소용돌이', SWIRL.x, SWIRL.y + SWIRL.r + 50, 44, 'normal');

  // Burnt edges.
  const vg = g.createRadialGradient(MW / 2, MH / 2, MH * 0.45, MW / 2, MH / 2, MW * 0.62);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(40,24,8,0.6)');
  g.fillStyle = vg; g.fillRect(0, 0, MW, MH);
  return map;
}

function buildSwirl() {
  const s = SWIRL.r * 2 + 40; const c = canvas(s, s); const g = c.getContext('2d'); const cx = s / 2, cy = s / 2;
  g.lineCap = 'round';
  const arms = 4;
  for (let arm = 0; arm < arms; arm++) {
    const pts = [];
    for (let k = 0; k <= 700; k++) {
      const u = k / 700; const th = u * Math.PI * 2 * 2.6 + arm * (Math.PI * 2 / arms); const r = SWIRL.r * Math.pow(u, 0.9);
      pts.push([cx + Math.cos(th) * r, cy + Math.sin(th) * r * 0.9, u]);
    }
    for (let k = 1; k < pts.length; k++) {
      const [x0, y0] = pts[k - 1], [x1, y1, u] = pts[k];
      const a = Math.min(1, u * 6) * (1 - Math.pow(u, 3));
      g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1);
      g.strokeStyle = `rgba(58,40,22,${0.75 * a})`; g.lineWidth = 3 + 7 * (1 - u); g.stroke();
    }
    for (let k = 1; k < pts.length; k++) {
      const [x0, y0] = pts[k - 1], [x1, y1, u] = pts[k];
      const a = Math.min(1, u * 6) * (1 - Math.pow(u, 3));
      g.beginPath(); g.moveTo(x0 + 3, y0 + 3); g.lineTo(x1 + 3, y1 + 3);
      g.strokeStyle = `rgba(235,225,190,${0.22 * a})`; g.lineWidth = 2; g.stroke();
    }
  }
  const core = g.createRadialGradient(cx, cy, 0, cx, cy, SWIRL.r * 0.45); core.addColorStop(0, 'rgba(36,26,14,0.75)'); core.addColorStop(1, 'rgba(36,26,14,0)');
  g.fillStyle = core; g.fillRect(0, 0, s, s);
  return c;
}

// Camera over the map at song time t: centre (map px) and zoom (output px per map px).
const FULL = W / MW;
const VIEWS = {
  full: (t) => ({ x: lerp(2250, 2000, ramp(t, 9, 14)), y: 1000, z: FULL * lerp(1.02, 1.17, ramp(t, 8, 14)) }),
  west: (t) => ({ x: lerp(1080, 1180, ramp(t, 13.6, 20)), y: lerp(880, 1050, ramp(t, 13.6, 20)), z: FULL * lerp(2.15, 2.3, ramp(t, 13.6, 20)) }),
  east: (t) => ({ x: lerp(1180, 3420, ramp(t, 19.2, 22.2)), y: lerp(1050, 1060, ramp(t, 19.2, 26)), z: FULL * lerp(2.3, 2.0, ramp(t, 19.2, 27.5)) }),
  end: (t) => ({ x: 2150, y: 1000, z: FULL * lerp(1.12, 1.0, ramp(t, 27.5, 39.5)) }),
};

function drawMapView(v, t, alpha) {
  if (alpha <= 0) return;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(W / 2, H / 2); ctx.scale(v.z, v.z); ctx.translate(-v.x, -v.y);
  ctx.drawImage(MAP, 0, 0);
  // The maelstrom turns slowly.
  ctx.translate(SWIRL.x, SWIRL.y); ctx.rotate(-t * 0.16);
  ctx.drawImage(SWIRL_C, -SWIRL_C.width / 2, -SWIRL_C.height / 2);
  ctx.restore();
}

function drawMap(t) {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  // Dissolves between the camera's views, as the original does: full view out of black, then
  // closer on Clawhaven, a pan east across the other worlds, and back to the full view.
  if (t >= 13.6 && t < 19.2) drawMapView(VIEWS.west(t), t, 1);
  if (t >= 19.2) drawMapView(VIEWS.east(t), t, 1);
  drawMapView(VIEWS.full(t), t, Math.min(ramp(t, 7.5, 9.6), 1 - ramp(t, 13.6, 14.4)));
  if (t >= 27.4) drawMapView(VIEWS.end(t), t, ramp(t, 27.4, 29.4));
  // Glow and a darker, warmer frame toward the presents line.
  const dark = 0.25 * ramp(t, 29, 31);
  const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.25, W / 2, H / 2, W * 0.62);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, `rgba(10,6,2,${0.4 + dark})`);
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  // The presents line.
  const ta = Math.min(ramp(t, 30.2, 32.2), 1 - ramp(t, 38.4, 39.3));
  if (ta > 0) {
    ctx.save(); ctx.globalAlpha = ta; ctx.font = '500 30px Cinzel'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const text = 'INHYUK SEO  &  INKEUN SEO  PRESENT';
    ctx.letterSpacing = '9px';
    const white = ramp(t, 36.6, 38.4);
    ctx.fillStyle = `rgba(${Math.round(lerp(236, 120, white))},${Math.round(lerp(226, 116, white))},${Math.round(lerp(200, 110, white))},1)`;
    ctx.shadowColor = `rgba(0,0,0,${0.8 * (1 - white)})`; ctx.shadowBlur = 12;
    ctx.fillText(text, W / 2, H / 2 + 6);
    ctx.restore();
  }
  // Into white.
  const wa = ramp(t, 36.6, 38.6);
  if (wa > 0) { ctx.save(); ctx.globalAlpha = wa; ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H); ctx.restore();
    if (ta > 0) { ctx.save(); ctx.globalAlpha = ta * 0.9; ctx.font = '500 30px Cinzel'; ctx.letterSpacing = '9px'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#8a857c'; ctx.fillText('INHYUK SEO  &  INKEUN SEO  PRESENT', W / 2, H / 2 + 6); ctx.restore(); } }
}

// ----------------------------------------------------------------------------------- rating card
function drawRating(t) {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  const a = Math.min(ramp(t, 0.1, 0.6), 1 - ramp(t, 5.0, 5.8));
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a;
  const s = 330, x = W / 2 - s / 2, y = H / 2 - s / 2 - 60;
  ctx.fillStyle = '#2fa24a'; ctx.beginPath(); ctx.roundRect(x, y, s, s, 46); ctx.fill();
  ctx.fillStyle = '#ffffff'; ctx.font = '900 138px Cinzel'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('ALL', W / 2, y + s / 2 + 8);
  ctx.font = `bold 60px "Apple SD Gothic Neo", sans-serif`; ctx.fillText('전체이용가', W / 2, y + s + 74);
  ctx.restore();
}

// ----------------------------------------------------------------------------------- logo
function drawLogo(t) {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  const lw = 1480, lh = lw * LOGO.height / LOGO.width; const lx = W / 2 - lw / 2, ly = H / 2 - lh / 2;
  const p = ramp(t, 163.12, 165.1); // burn-in progress
  const out = 1 - ramp(t, 170.9, 172.2);
  if (out <= 0) return;
  // A warm flare behind the emblem as it ignites.
  const flare = Math.exp(-Math.max(0, t - 165.0) * 1.3) * ramp(t, 163.8, 165.0) * out;
  if (flare > 0.01) {
    const gr = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, 900); gr.addColorStop(0, `rgba(255,190,90,${0.85 * flare})`); gr.addColorStop(0.4, `rgba(255,110,30,${0.35 * flare})`); gr.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
  }
  // Burn the logo in through a noise threshold with a glowing edge.
  const nw = LOGO_NOISE.width, nh = LOGO_NOISE.height;
  const mask = canvas(nw, nh); const mg = mask.getContext('2d'); const md = mg.createImageData(nw, nh);
  const edge = canvas(nw, nh); const eg = edge.getContext('2d'); const ed = eg.createImageData(nw, nh);
  const nd = LOGO_NOISE.data; const thr = lerp(0.08, 1.08, p);
  for (let k = 0, q = 0; k < nd.length; k++, q += 4) {
    const v = nd[k];
    md.data[q + 3] = v < thr ? 255 : 0;
    const e = 1 - Math.abs(v - thr) / 0.07; if (e > 0 && p < 1) { ed.data[q] = 255; ed.data[q + 1] = 150 + 80 * e; ed.data[q + 2] = 60; ed.data[q + 3] = 255 * e; }
  }
  mg.putImageData(md, 0, 0); eg.putImageData(ed, 0, 0);
  const L = canvas(lw, lh); const lg = L.getContext('2d');
  lg.drawImage(LOGO, 0, 0, lw, lh); lg.globalCompositeOperation = 'destination-in'; lg.filter = 'blur(2px)'; lg.drawImage(mask, 0, 0, lw, lh);
  const scale = lerp(1.06, 1.0, smooth(ramp(t, 163.1, 166)));
  ctx.save(); ctx.globalAlpha = out; ctx.translate(W / 2, H / 2); ctx.scale(scale, scale); ctx.translate(-W / 2, -H / 2);
  ctx.drawImage(L, lx, ly);
  // The edge glow, only over the logo's own shape.
  const E = canvas(lw, lh); const egc = E.getContext('2d'); egc.filter = 'blur(6px)'; egc.drawImage(edge, 0, 0, lw, lh); egc.filter = 'none'; egc.globalCompositeOperation = 'destination-in'; egc.drawImage(LOGO, 0, 0, lw, lh);
  ctx.globalCompositeOperation = 'lighter'; ctx.drawImage(E, lx, ly); ctx.drawImage(E, lx, ly);
  // The letters blaze as the fire passes, then settle.
  if (flare > 0.02) {
    const B = canvas(lw, lh); const bg = B.getContext('2d'); bg.filter = 'blur(10px)'; bg.drawImage(L, 0, 0); bg.filter = 'none';
    bg.globalCompositeOperation = 'source-in'; bg.fillStyle = 'rgb(255,170,70)'; bg.fillRect(0, 0, lw, lh);
    ctx.globalAlpha = out * flare * 0.5; ctx.drawImage(B, lx, ly); ctx.globalAlpha = out;
  }
  // A slow light sweep across the gold while it holds.
  const sw = ramp(t, 165.3, 168.3);
  if (sw > 0 && sw < 1) {
    const S = canvas(lw, lh); const sg = S.getContext('2d'); const sx = lerp(-0.3, 1.3, sw) * lw;
    const gr = sg.createLinearGradient(sx - 160, 0, sx + 160, lh); gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(0.5, 'rgba(255,240,200,0.55)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    sg.fillStyle = gr; sg.fillRect(0, 0, lw, lh); sg.globalCompositeOperation = 'destination-in'; sg.drawImage(LOGO, 0, 0, lw, lh);
    ctx.drawImage(S, lx, ly);
  }
  ctx.restore();
}

// ----------------------------------------------------------------------------------- entry points
window.cardsInit = async (islands) => {
  await document.fonts.load('500 30px Cinzel'); await document.fonts.load('900 138px Cinzel');
  const [parchment, logo] = await Promise.all([img('/art/ui/parchment.webp'), img('/art/logo.webp')]);
  LOGO = logo;
  MAP = await buildMap(islands, parchment);
  SWIRL_C = buildSwirl();
  // Burn-in noise for the logo, at a quarter of its drawn size.
  const nw = 300, nh = Math.round(nw * logo.height / logo.width); const nz = makeNoise(9); const data = new Float32Array(nw * nh);
  for (let j = 0; j < nh; j++) for (let i = 0; i < nw; i++) { const dx = (i - nw / 2) / nw, dy = (j - nh / 2) / nw; data[j * nw + i] = 0.55 * Math.hypot(dx, dy) * 1.6 + 0.45 * nz(i * 0.04, j * 0.04); }
  LOGO_NOISE = { width: nw, height: nh, data };
  return true;
};
/** Draw the frame at song time t (seconds). */
window.renderAt = (t) => {
  if (t < 7.5) drawRating(t);
  else if (t < 40) drawMap(t);
  else drawLogo(t);
};
window.mapCanvas = () => MAP;
</script>
