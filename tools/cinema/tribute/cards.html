<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Tribute cards</title>
<!--
  The tribute's 2D cards as a pure function of song time: the rating card, the engraved gold map of
  the six worlds and the logo. tools/cinema/tribute/cards.mjs opens this page on the dev server, hands
  it the islands (tools/cinema/tribute/islands.mjs: the worlds' real ground heights) and records frames
  with renderAt(t). The map is a WebGL2 shader on #g (relief from the worlds' coasts and heights); the
  cards and the map's titles are drawn on the 2D canvas #c above it.
-->
<style>
  @font-face { font-family: 'Cinzel'; font-weight: 400 900; src: url('/fonts/cinzel-latin-wght.woff2') format('woff2'); }
  html, body { margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; position: absolute; left: 0; top: 0; }
</style>
</head>
<body>
<canvas id="g" width="1920" height="872"></canvas>
<canvas id="c" width="1920" height="872"></canvas>
<script type="module">
const W = 1920, H = 872;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const glc = document.getElementById('g');
const KO = '"AppleMyungjo", "Apple SD Gothic Neo", serif';

// ----------------------------------------------------------------------------------- helpers
const clamp01 = (x) => (x < 0 ? 0 : x > 1 ? 1 : x);
const smooth = (x) => { x = clamp01(x); return x * x * (3 - 2 * x); };
const lerp = (a, b, k) => a + (b - a) * k;
const ramp = (t, a, b) => smooth((t - a) / (b - a));
function mulberry(seed) { let a = seed >>> 0; return () => { a = (a + 0x6d2b79f5) >>> 0; let x = a; x = Math.imul(x ^ (x >>> 15), x | 1); x ^= x + Math.imul(x ^ (x >>> 7), x | 61); return ((x ^ (x >>> 14)) >>> 0) / 4294967296; }; }
function canvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
const img = (src) => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });

// Value noise and fbm on a lattice (seeded), for coast warps and textures.
function makeNoise(seed) {
  const r = mulberry(seed); const P = new Float32Array(256 * 256); for (let i = 0; i < P.length; i++) P[i] = r();
  const at = (x, y) => P[((y & 255) << 8) | (x & 255)];
  const n = (x, y) => { const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi; const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
    return lerp(lerp(at(xi, yi), at(xi + 1, yi), u), lerp(at(xi, yi + 1), at(xi + 1, yi + 1), u), v); };
  return (x, y, oct = 4) => { let s = 0, a = 0.5, f = 1; for (let i = 0; i < oct; i++) { s += a * n(x * f, y * f); f *= 2.03; a *= 0.5; } return s; };
}

// ----------------------------------------------------------------------------------- the map
// An engraved gold plate. cardsInit builds a signed distance field of the land (map px, + on land)
// from the worlds' sampled coasts and a few drawn capes, an elevation field (real heights plus
// mountain ranges) and a label layer (carved names, raised range marks). A WebGL2 shader turns them
// into hillshaded gold relief on a patina sea with the turning maelstrom; a post pass adds glow, zoom
// blur, vignette and grain. The sea is procedural and unbounded: no view shows past the plate.
const MW = 4400, MH = 2000; // map space (px)
const GS = 2, GW = MW / GS, GH = MH / GS; // field grid: one cell per 2 map px
const SWIRL = { x: 1810, y: 975, r: 250 };

// The two continents' outlines (map px), drawn after the original plate: Clawhaven tall in the west
// with a north-east arm, the east continent (Frostlight joined to Starhaven) with a hooked north.
const WEST = [[960, 240], [1080, 250], [1170, 330], [1230, 420], [1330, 440], [1450, 430], [1530, 480], [1500, 560], [1390, 590],
  [1420, 700], [1450, 900], [1450, 1200], [1430, 1450], [1330, 1560], [1200, 1640], [1120, 1760], [1000, 1840], [900, 1830],
  [840, 1720], [760, 1600], [640, 1480], [560, 1330], [540, 1150], [570, 960], [560, 800], [620, 620], [700, 470], [820, 330]];
const EAST = [[2640, 140], [2800, 80], [3000, 70], [3200, 110], [3340, 210], [3380, 360], [3320, 520], [3240, 650], [3180, 780],
  [3170, 870], [3200, 960], [3290, 1050], [3350, 1200], [3370, 1380], [3320, 1540], [3220, 1650], [3080, 1720], [2900, 1740],
  [2790, 1680], [2700, 1560], [2680, 1400], [2730, 1250], [2770, 1120], [2800, 1000], [2790, 920], [2730, 860], [2680, 760],
  [2640, 640], [2560, 560], [2500, 460], [2540, 380], [2600, 300], [2600, 220]];
// Worlds in map space: centre, scale (map px per world unit), rotation, stretch, coast warp (world
// units), elevation scale. Clawhaven is its real land (east coast, voyage islands) inside WEST;
// Frostlight and Starhaven lie in EAST and give it relief; the rest are islands between and south.
const WORLDS = [
  { c: 1, x: 880, y: 1000, s: 2.3, rot: 0, warp: 10, seed: 11, clip: WEST, elev: 1 / 50 },
  { c: 4, x: 2960, y: 430, s: 1.7, rot: -0.12, warp: 30, seed: 41, sx: 1.3, sy: 0.9, elev: 1 / 24 },
  { c: 2, x: 3030, y: 1360, s: 1.6, rot: 0.18, warp: 30, seed: 21, sx: 1.02, sy: 1.18, elev: 1 / 13 },
  { c: 3, x: 2130, y: 1470, s: 0.9, rot: 1.1, warp: 40, seed: 31, sx: 1.25, sy: 0.7, elev: 1 / 26 },
  { c: 6, x: 2480, y: 1580, s: 0.75, rot: -0.7, warp: 44, seed: 61, sx: 0.8, sy: 1.25, elev: 1 / 26 },
  { c: 5, x: 1600, y: 1720, s: 0.85, rot: 2.2, warp: 70, seed: 51, sx: 1.5, sy: 0.6, elev: 1 / 26 },
];
// Drawn land (+) and sea (-): a lake, bays and islets. [sign, x1, y1, x2, y2, width] is a capsule;
// a zero-length one is a disc.
const SHAPES = [
  ['-', 3040, 400, 3040, 400, 30], ['-', 3170, 1460, 3170, 1460, 20], ['-', 520, 1240, 600, 1200, 50],
  ['+', 1480, 1400, 1480, 1400, 40], ['+', 1380, 1680, 1380, 1680, 34], ['+', 2330, 1300, 2330, 1300, 36],
  ['+', 2580, 1340, 2580, 1340, 30], ['+', 2000, 1730, 2000, 1730, 30], ['+', 1770, 1560, 1770, 1560, 26],
  ['+', 3480, 1500, 3480, 1500, 34], ['+', 400, 640, 400, 640, 30], ['+', 1250, 190, 1250, 190, 34],
  ['+', 2420, 900, 2420, 900, 28], ['+', 3460, 760, 3460, 760, 30],
];
// Mountain ranges as polylines (map px): raised in the elevation field and marked with carved peaks.
const RANGES_M = [
  [[860, 330], [740, 560], [700, 820], [720, 1100], [800, 1380], [900, 1650]],
  [[1080, 380], [1250, 470], [1420, 500]],
  [[1080, 1250], [1150, 1450], [1060, 1620]],
  [[2620, 260], [2820, 200], [3100, 220], [3290, 330]],
  [[2700, 560], [2900, 700], [3150, 640]],
  [[2900, 1150], [2860, 1400], [2950, 1620]],
];
const LABELS = [ // [text, x, y, size, weight]
  ['클로헤이븐', 960, 940, 120, 'bold'], ['서리빛 설원', 2950, 640, 88, 'bold'], ['잊힌 별의 섬', 3030, 1290, 88, 'bold'],
  ['새벽 항구', 2130, 1470, 46, 'bold'], ['하늘숲', 2480, 1580, 46, 'bold'], ['잿불 군도', 1600, 1720, 46, 'bold'],
];
// Clawhaven's places (world units from its centre), marked with a carved cross.
const PLACES = [['달샘 숲', -80, 50], ['철의 난파선', 150, 115], ['솔트미어 등대', 190, -132], ['소금물 해안', 120, 40]];
// Frostlight's and Starhaven's places on the east continent (map px).
const EAST_PLACES = [['눈꽃 마을', 2880, 780], ['얼음 왕좌', 3180, 330], ['별빛 항구', 2880, 1150], ['달그늘 수정 숲', 3120, 1500]];

let GL = null, LOGO = null, LOGO_NOISE = null, PRESENT = null;

/** Squared distance transform of one row (Felzenszwalb and Huttenlocher). */
function edt1(f, n, d, v, z) {
  let k = 0; v[0] = 0; z[0] = -1e30; z[1] = 1e30;
  for (let q = 1; q < n; q++) {
    let s = ((f[q] + q * q) - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]);
    while (s <= z[k]) { k--; s = ((f[q] + q * q) - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]); }
    k++; v[k] = q; z[k] = s; z[k + 1] = 1e30;
  }
  k = 0;
  for (let q = 0; q < n; q++) { while (z[k + 1] < q) k++; d[q] = (q - v[k]) * (q - v[k]) + f[v[k]]; }
}
/** Distance (cells) from every cell to the nearest cell whose mask equals `target`. */
function edt(mask, w, h, target) {
  const g = new Float64Array(w * h); for (let i = 0; i < w * h; i++) g[i] = mask[i] === target ? 0 : 1e20;
  const n = Math.max(w, h); const f = new Float64Array(n), d = new Float64Array(n), v = new Int32Array(n), z = new Float64Array(n + 1);
  for (let x = 0; x < w; x++) { for (let y = 0; y < h; y++) f[y] = g[y * w + x]; edt1(f, h, d, v, z); for (let y = 0; y < h; y++) g[y * w + x] = d[y]; }
  for (let y = 0; y < h; y++) { for (let x = 0; x < w; x++) f[x] = g[y * w + x]; edt1(f, w, d, v, z); for (let x = 0; x < w; x++) g[y * w + x] = Math.sqrt(d[x]); }
  return g;
}
/** Separable box blur of a float grid, `passes` times (close to a gaussian). */
function boxBlur(a, w, h, r, passes = 2) {
  const t = new Float32Array(w * h);
  for (let p = 0; p < passes; p++) {
    for (let y = 0; y < h; y++) { let s = 0; const o = y * w; for (let x = -r; x <= r; x++) s += a[o + Math.min(w - 1, Math.max(0, x))];
      for (let x = 0; x < w; x++) { t[o + x] = s / (2 * r + 1); s += a[o + Math.min(w - 1, x + r + 1)] - a[o + Math.max(0, x - r)]; } }
    for (let x = 0; x < w; x++) { let s = 0; for (let y = -r; y <= r; y++) s += t[Math.min(h - 1, Math.max(0, y)) * w + x];
      for (let y = 0; y < h; y++) { a[y * w + x] = s / (2 * r + 1); s += t[Math.min(h - 1, y + r + 1) * w + x] - t[Math.max(0, y - r) * w + x]; } }
  }
  return a;
}

/** A test for grid cells inside a polygon (map px). */
function polyMask(poly) {
  const c = canvas(GW, GH); const g = c.getContext('2d'); g.scale(1 / GS, 1 / GS); g.fillStyle = '#fff';
  g.beginPath(); poly.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y))); g.closePath(); g.fill();
  const d = g.getImageData(0, 0, GW, GH).data; return (gx, gy) => d[(gy * GW + gx) * 4 + 3] > 127;
}
/** Land mask and elevation on the field grid, then the signed distance field. */
function buildField(data) {
  const N = GW * GH; const land = new Uint8Array(N); const elev = new Float32Array(N);
  for (const def of WORLDS) {
    const d = data[def.c]; const n = d.n, hgt = d.h, noise = makeNoise(def.seed);
    const inClip = def.clip ? polyMask(def.clip) : null;
    const sx = def.sx ?? 1, sy = def.sy ?? 1, cos = Math.cos(def.rot), sin = Math.sin(def.rot);
    const half = (n - 1) * d.step / 2 * def.s * Math.max(sx, sy) * 1.5;
    const gx0 = Math.max(0, Math.floor((def.x - half) / GS)), gx1 = Math.min(GW - 1, Math.ceil((def.x + half) / GS));
    const gy0 = Math.max(0, Math.floor((def.y - half) / GS)), gy1 = Math.min(GH - 1, Math.ceil((def.y + half) / GS));
    for (let gy = gy0; gy <= gy1; gy++) for (let gx = gx0; gx <= gx1; gx++) {
      const u = ((gx + 0.5) * GS - def.x) / def.s, v = ((gy + 0.5) * GS - def.y) / def.s;
      const ru = (u * cos + v * sin) / sx, rv = (-u * sin + v * cos) / sy;
      const wu = ru + (noise(ru * 0.02, rv * 0.02) - 0.5) * def.warp * 2 + (noise(ru * 0.08 + 9, rv * 0.08) - 0.5) * def.warp * 0.6;
      const wv = rv + (noise(ru * 0.02 + 5, rv * 0.02 + 3) - 0.5) * def.warp * 2 + (noise(ru * 0.08, rv * 0.08 + 7) - 0.5) * def.warp * 0.6;
      const fi = (wu - d.x0) / d.step, fj = (wv - d.z0) / d.step;
      const inTile = fi >= 0 && fj >= 0 && fi <= n - 1 && fj <= n - 1;
      if (!inTile && !def.clip) continue;
      let hv = 0;
      if (inTile) { const i0 = Math.min(n - 2, Math.floor(fi)), j0 = Math.min(n - 2, Math.floor(fj)), a = fi - i0, b = fj - j0;
        hv = lerp(lerp(hgt[j0 * n + i0], hgt[j0 * n + i0 + 1], a), lerp(hgt[(j0 + 1) * n + i0], hgt[(j0 + 1) * n + i0 + 1], a), b); }
      let isLand = hv > 0.02;
      // Clawhaven: the outline everywhere but its real east coast and voyage islands (the sampled
      // square's other edges are only the world's bounds).
      if (def.clip) isLand = (inClip(gx, gy) && !(hv <= 0.02 && wu > 60 && wu < 330 && wv > -170 && wv < 230)) || (hv > 0.02 && wu > 170);
      if (isLand) { const k = gy * GW + gx; land[k] = 1; elev[k] = Math.max(elev[k], clamp01(hv * def.elev)); }
    }
  }
  // The east continent, then drawn lakes, bays and islets.
  const inEast = polyMask(EAST);
  for (let gy = 0; gy < GH; gy++) for (let gx = 0; gx < GW; gx++) { const k = gy * GW + gx; if (inEast(gx, gy) && !land[k]) { land[k] = 1; elev[k] = 0.1; } }
  const add = canvas(GW, GH), cut = canvas(GW, GH); const ag = add.getContext('2d'), cg = cut.getContext('2d');
  for (const g of [ag, cg]) { g.lineCap = 'round'; g.strokeStyle = '#fff'; g.scale(1 / GS, 1 / GS); }
  for (const [sign, x1, y1, x2, y2, w] of SHAPES) { const g = sign === '+' ? ag : cg; g.lineWidth = w * 2; g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2 + 0.01, y2); g.stroke(); }
  const ad = ag.getImageData(0, 0, GW, GH).data, cd = cg.getImageData(0, 0, GW, GH).data;
  for (let k = 0; k < N; k++) { if (ad[k * 4 + 3] > 127 && !land[k]) { land[k] = 1; elev[k] = 0.08; } if (cd[k * 4 + 3] > 127) land[k] = 0; }
  // Mountain ranges: soft ridges in the elevation.
  const rc = canvas(GW, GH); const rg = rc.getContext('2d'); rg.scale(1 / GS, 1 / GS); rg.filter = `blur(${40 / GS}px)`;
  rg.strokeStyle = '#fff'; rg.lineCap = rg.lineJoin = 'round'; rg.lineWidth = 120;
  for (const pl of RANGES_M) { rg.beginPath(); pl.forEach(([x, y], i) => (i ? rg.lineTo(x, y) : rg.moveTo(x, y))); rg.stroke(); }
  const rd = rg.getImageData(0, 0, GW, GH).data;
  for (let k = 0; k < N; k++) elev[k] = land[k] ? clamp01(elev[k] * 0.7 + 0.75 * rd[k * 4 + 3] / 255) : 0;
  boxBlur(elev, GW, GH, 6);
  // Signed distance (map px): + inside land.
  const toSea = edt(land, GW, GH, 0), toLand = edt(land, GW, GH, 1);
  const out = new Float32Array(N * 2);
  for (let k = 0; k < N; k++) { const sd = land[k] ? toSea[k] - 0.5 : -(toLand[k] - 0.5); out[k * 2] = Math.max(-700, Math.min(700, sd * GS)); out[k * 2 + 1] = elev[k]; }
  // Keep the plate's border open sea, so clamped lookups outside the map stay sea.
  for (let gy = 0; gy < GH; gy++) for (let gx = 0; gx < GW; gx++) if (gx === 0 || gy === 0 || gx === GW - 1 || gy === GH - 1) { out[(gy * GW + gx) * 2] = -700; out[(gy * GW + gx) * 2 + 1] = 0; }
  return { field: out, land };
}

/** Labels (red: ink, green: soft carve) and range peaks (blue: raised) at map resolution. */
function buildLabels(land) {
  const c = canvas(MW, MH); const g = c.getContext('2d');
  g.fillStyle = '#000'; g.fillRect(0, 0, MW, MH); g.globalCompositeOperation = 'lighter';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  const w1 = WORLDS[0];
  const texts = LABELS.map(([s, x, y, size, weight]) => [s, x, y, size, weight]);
  const places = [...PLACES.map(([n, wx, wz]) => [n, w1.x + wx * w1.s, w1.y + wz * w1.s]), ...EAST_PLACES];
  for (const [name, x, y] of places) texts.push(['+', x, y, 44, 'bold'], [name, x - 26 - name.length * 21, y + 2, 40, 'bold']);
  texts.push(['소용돌이', SWIRL.x, SWIRL.y + SWIRL.r + 70, 52, 'bold']);
  const pass = (color, blur) => { g.filter = blur ? `blur(${blur}px)` : 'none'; g.fillStyle = color;
    for (const [s, x, y, size, weight] of texts) { g.font = `${weight} ${size}px ${KO}`; g.letterSpacing = `${Math.round(size * 0.08)}px`; g.fillText(s, x, y); } };
  pass('#f00', 0); pass('#0f0', 2.5);
  // Peaks along the ranges, carved as small raised chevrons (only on land).
  const r = mulberry(77); const onLand = (x, y) => land[Math.floor(y / GS) * GW + Math.floor(x / GS)] === 1;
  g.filter = 'blur(1.4px)'; g.strokeStyle = '#00f'; g.lineCap = g.lineJoin = 'round'; g.lineWidth = 5;
  for (const pl of RANGES_M) for (let i = 1; i < pl.length; i++) {
    const [x0, y0] = pl[i - 1], [x1, y1] = pl[i]; const len = Math.hypot(x1 - x0, y1 - y0);
    for (let d = 0; d < len; d += 34) {
      const k = d / len; const x = lerp(x0, x1, k) + (r() - 0.5) * 120, y = lerp(y0, y1, k) + (r() - 0.5) * 120, s = 16 + r() * 14;
      if (!onLand(x, y) || !onLand(x, y - 40) || !onLand(x, y + 40)) continue;
      g.beginPath(); g.moveTo(x - s, y + s * 0.55); g.lineTo(x - s * 0.1, y - s * 0.65); g.lineTo(x + s * 0.4, y - s * 0.05); g.lineTo(x + s * 0.65, y - s * 0.3); g.lineTo(x + s * 1.1, y + s * 0.55); g.stroke();
    }
  }
  return c;
}

const VS = `#version 300 es
in vec2 aPos; void main() { gl_Position = vec4(aPos, 0.0, 1.0); }`;
const FS_MAP = `#version 300 es
precision highp float;
uniform sampler2D uField, uLab;
uniform vec2 uRes, uMap;
uniform vec3 uView, uSwirl;
uniform float uT, uAlpha;
out vec4 o;
float hash(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float vnoise(vec2 p) { vec2 i = floor(p), f = fract(p); vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1, 0)), u.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), u.x), u.y); }
const mat2 ROT = mat2(0.8, -0.6, 0.6, 0.8);
float fbm(vec2 p, int oct) { float s = 0.0, a = 0.5, n = 0.0; for (int i = 0; i < 6; i++) { if (i >= oct) break; s += a * vnoise(p); n += a; p = ROT * p * 2.03 + 17.1; a *= 0.5; } return s / n; }
float sfbm(vec2 p, int oct) { return (fbm(p, oct) - 0.5) * 2.0; }
float ridged(vec2 p) { float s = 0.0, a = 0.5; for (int i = 0; i < 4; i++) { float n = 1.0 - abs(2.0 * vnoise(p) - 1.0); s += a * n * n; p = ROT * p * 2.1 + 3.7; a *= 0.5; } return s / 0.9375; }

// Signed coast distance (map px, + on land): the built field, warped and roughened.
float coastAt(vec2 p, out float elev) {
  vec2 w = vec2(sfbm(p / 300.0, 3), sfbm(p / 300.0 + 5.2, 3));
  vec2 fe = texture(uField, (p + w * 55.0) / uMap).rg;
  elev = fe.y;
  return fe.x + 60.0 * sfbm(p / 380.0 + 9.1, 3) + 30.0 * sfbm(p / 95.0 + 2.7, 4) + 7.0 * sfbm(p / 16.0, 2);
}
// The maelstrom: x carved spiral grooves, y fine brushed hatching around it.
vec2 swirl(vec2 p) {
  vec2 d = (p - uSwirl.xy) / uSwirl.z; float r = length(d);
  if (r > 1.7) return vec2(0.0);
  float a = atan(d.y, d.x) + uT * 0.16;
  float wob = sfbm(d * 2.5 + 4.0, 3);
  float g = cos(3.0 * a - 6.2832 * 5.5 * pow(r, 0.85) + wob * 1.4);
  float groove = smoothstep(0.35, 0.95, g) * smoothstep(1.02, 0.72, r) * smoothstep(0.02, 0.1, r);
  float hz = cos(90.0 * a - 6.2832 * 9.0 * r + wob * 5.0);
  float hatch = smoothstep(0.4, 1.0, hz) * smoothstep(0.5, 0.85, r) * smoothstep(1.7, 1.0, r) * smoothstep(0.38, 0.6, fbm(d * 5.0 + 1.3, 3));
  return vec2(groove, hatch);
}
// Height (map px) of the plate: gold land above the sea, ranges, texture, carved labels and swirl.
float heightAt(vec2 p, out float cf, out float elev, out vec4 lab, out vec2 sw) {
  cf = coastAt(p, elev);
  float land = smoothstep(-1.0, 1.0, cf);
  lab = texture(uLab, p / uMap);
  sw = swirl(p);
  float hl = 9.0 + 7.0 * smoothstep(0.0, 50.0, cf) + 5.0 * smoothstep(40.0, 260.0, cf)
    + elev * (10.0 + 28.0 * ridged(p / 115.0)) + 4.0 * fbm(p / 75.0, 4) + 0.5 * vnoise(p / 6.0);
  float hs = 5.0 * fbm(p / 170.0, 4) + 1.3 * fbm(p / 20.0, 3)
    + 2.6 * exp(-pow((cf + 24.0) / 5.0, 2.0)) - 3.5 * smoothstep(-80.0, -3.0, cf)
    - 5.0 * sw.x - 1.6 * sw.y;
  return mix(hs, hl, land) - 6.5 * lab.g + 4.5 * lab.b;
}
void main() {
  vec2 p = uView.xy + (gl_FragCoord.xy - 0.5 * uRes) * vec2(1.0, -1.0) / uView.z;
  float e = max(1.0, 0.9 / uView.z);
  float cf, elev, c1, e1; vec4 lab, l1; vec2 sw, s1;
  float h = heightAt(p, cf, elev, lab, sw);
  float hx = heightAt(p + vec2(e, 0.0), c1, e1, l1, s1);
  float hy = heightAt(p + vec2(0.0, e), c1, e1, l1, s1);
  vec3 n = normalize(vec3(-(hx - h) / e, -(hy - h) / e, 1.0));
  vec3 L = normalize(vec3(-0.6 + 0.2 * sin(uT * 0.21), -0.62, 0.58)); // upper left (map y points down)
  float diff = max(dot(n, L), 0.0);
  float land = smoothstep(-1.0, 1.0, cf);

  // Sea: a mottled patina of olive, verdigris, teal and rust with paler glowing areas.
  float n1 = fbm(p / 700.0 + 1.7, 4), n2 = fbm(p / 320.0 + 5.1, 4), n3 = fbm(p / 150.0 + 8.9, 4), n4 = fbm(p / 950.0 + 2.2, 3);
  vec3 sea = mix(vec3(0.63, 0.61, 0.36), vec3(0.50, 0.59, 0.38), smoothstep(0.38, 0.62, n1));
  sea = mix(sea, vec3(0.27, 0.46, 0.42), smoothstep(0.55, 0.72, n2) * 0.8);
  sea = mix(sea, vec3(0.60, 0.41, 0.22), smoothstep(0.58, 0.76, n3) * 0.45);
  sea = mix(sea, vec3(0.88, 0.84, 0.60), smoothstep(0.5, 0.75, n4) * 0.55);
  sea *= 0.84 + 0.32 * fbm(p / 14.0, 3);
  float halo = 1.0 - smoothstep(-70.0, -4.0, cf);
  sea = mix(sea * vec3(0.66, 0.58, 0.44), sea, halo);
  vec2 sd = (p - uSwirl.xy) / uSwirl.z; float sr = length(sd);
  sea = mix(sea, vec3(0.76, 0.66, 0.60), 0.35 * smoothstep(1.1, 0.2, sr));
  sea = mix(sea, vec3(0.30, 0.20, 0.17), 0.5 * sw.x + 0.45 * sw.y);
  float ce; float shadow = smoothstep(-8.0, 12.0, coastAt(p - normalize(L.xy) * 18.0, ce));
  sea *= (0.52 + 0.62 * diff) * (1.0 - 0.45 * shadow * (1.0 - land));

  // Land: gold, bright yellow on the ridges, burnt orange and brown in creases and along the coast.
  float m = fbm(p / 190.0 + 3.3, 4);
  float k = clamp((h - 12.0) / 34.0, 0.0, 1.0);
  vec3 gold = mix(vec3(0.86, 0.52, 0.10), vec3(0.97, 0.78, 0.24), smoothstep(0.3, 0.68, m + 0.35 * k));
  gold = mix(gold, vec3(1.0, 0.88, 0.40), smoothstep(0.55, 1.0, k + 0.25 * (m - 0.5)) * 0.55);
  float rim = 1.0 - smoothstep(2.0, 22.0 + 30.0 * m, cf);
  gold = mix(gold, vec3(0.70, 0.34, 0.07), rim * 0.8);
  gold = mix(gold, vec3(0.22, 0.09, 0.02), 1.0 - smoothstep(0.5, 4.0, cf));
  vec3 Hv = normalize(L + vec3(0.0, 0.0, 1.0));
  float sheen = 0.55 + 0.45 * sin(p.x / 900.0 + p.y / 1400.0 - uT * 0.3);
  float spec = pow(max(dot(n, Hv), 0.0), 26.0) * sheen;
  vec3 metal = gold * (0.28 + 1.05 * diff) + spec * vec3(1.0, 0.8, 0.4) * 0.35;

  vec3 col = mix(sea, metal, land);
  // Carved ink in the labels.
  col = mix(col, mix(vec3(0.16, 0.10, 0.06), vec3(0.30, 0.12, 0.02), land), lab.r * 0.7 + lab.b * 0.35);
  o = vec4(col, uAlpha);
}`;
const FS_POST = `#version 300 es
precision highp float;
uniform sampler2D uScene;
uniform vec2 uRes;
uniform float uT, uBlur, uDark, uGlow, uFocus;
out vec4 o;
float hash(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
void main() {
  vec2 uv = gl_FragCoord.xy / uRes;
  vec3 c = vec3(0.0);
  if (uBlur > 0.0005) { vec2 d = uv - 0.5; for (int i = 0; i < 32; i++) c += texture(uScene, 0.5 + d * (1.0 - uBlur * float(i) / 31.0)).rgb; c /= 32.0; }
  else c = texture(uScene, uv).rgb;
  if (uFocus > 0.001) c = mix(c, textureLod(uScene, uv, 2.6).rgb, uFocus);
  vec3 g = textureLod(uScene, uv, 4.0).rgb * 0.5 + textureLod(uScene, uv, 6.0).rgb * 0.5;
  c += uGlow * g * g * vec3(1.0, 0.82, 0.55);
  float r = length((uv - 0.5) * vec2(2.0, 1.75));
  c *= mix(1.0, 0.3 - uDark, smoothstep(0.55 - uDark, 1.45, r)) * (1.0 - uDark);
  c *= mix(vec3(1.0), vec3(1.14, 0.92, 0.68), uDark * 2.0);
  c *= vec3(1.02, 0.97, 0.88);
  c += (hash(gl_FragCoord.xy + floor(uT * 24.0 + 0.5) * 61.7) - 0.5) * 0.035;
  o = vec4(c, 1.0);
}`;

function compile(gl, vs, fs) {
  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
  const p = gl.createProgram(); gl.attachShader(p, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs));
  gl.bindAttribLocation(p, 0, 'aPos'); gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {}; const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const name = gl.getActiveUniform(p, i).name; u[name] = gl.getUniformLocation(p, name); }
  return { p, u };
}

function initGL(data) {
  const gl = glc.getContext('webgl2', { preserveDrawingBuffer: true, antialias: false, alpha: false });
  if (!gl) throw new Error('no WebGL2');
  gl.getExtension('OES_texture_float_linear');
  const { field, land } = buildField(data);
  const tex = (unit) => { const t = gl.createTexture(); gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR); return t; };
  tex(0); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RG32F, GW, GH, 0, gl.RG, gl.FLOAT, field);
  tex(1); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, buildLabels(land)); gl.generateMipmap(gl.TEXTURE_2D);
  // The scene target, mipmapped for the glow.
  const scene = tex(2); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, W, H, 0, gl.RGBA, gl.UNSIGNED_BYTE, null); gl.generateMipmap(gl.TEXTURE_2D);
  const fbo = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, fbo); gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, scene, 0);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  const vb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, vb); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  const map = compile(gl, VS, FS_MAP), post = compile(gl, VS, FS_POST);
  gl.useProgram(map.p); gl.uniform1i(map.u.uField, 0); gl.uniform1i(map.u.uLab, 1);
  gl.uniform2f(map.u.uRes, W, H); gl.uniform2f(map.u.uMap, MW, MH); gl.uniform3f(map.u.uSwirl, SWIRL.x, SWIRL.y, SWIRL.r);
  gl.useProgram(post.p); gl.uniform1i(post.u.uScene, 2); gl.uniform2f(post.u.uRes, W, H);
  return { gl, fbo, scene, map, post };
}

// Camera over the map at song time t: centre (map px) and zoom (output px per map px).
const FULL = W / MW;
const VIEWS = {
  full: (t) => ({ x: lerp(2080, 1960, ramp(t, 9, 14)), y: 990, z: FULL * lerp(1.02, 1.17, ramp(t, 8, 14)) }),
  west: (t) => ({ x: lerp(1300, 1360, ramp(t, 13.6, 20)), y: lerp(930, 1040, ramp(t, 13.6, 20)), z: FULL * lerp(2.3, 2.45, ramp(t, 13.6, 20)) }),
  east: (t) => { const w = VIEWS.west(19.2); const k = ramp(t, 19.2, 20.9);
    return { x: lerp(w.x, 2720, k), y: lerp(w.y, 960, k), z: FULL * lerp(w.z / FULL, lerp(2.0, 1.82, ramp(t, 20.9, 27.5)), k) }; },
  end: (t) => ({ x: 1980, y: 990, z: FULL * lerp(1.12, 1.0, ramp(t, 27.5, 39.5)) }),
};

function drawMap(t) {
  const { gl, fbo, scene, map, post } = GL;
  // Dissolves between the camera's views, as the original does: full view out of black, then
  // closer on Clawhaven, a pan east across the other worlds, and back to the full view.
  const layers = [];
  if (t >= 13.6 && t < 19.2) layers.push([VIEWS.west(t), 1]);
  if (t >= 19.2) layers.push([VIEWS.east(t), 1]);
  layers.push([VIEWS.full(t), Math.min(ramp(t, 7.5, 9.6), 1 - ramp(t, 13.6, 14.4))]);
  if (t >= 27.4) layers.push([VIEWS.end(t), ramp(t, 27.4, 29.4)]);
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo); gl.viewport(0, 0, W, H);
  gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.useProgram(map.p); gl.enable(gl.BLEND); gl.blendFuncSeparate(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA, gl.ZERO, gl.ONE);
  gl.uniform1f(map.u.uT, t);
  for (const [v, a] of layers) { if (a <= 0) continue; gl.uniform3f(map.u.uView, v.x, v.y, v.z); gl.uniform1f(map.u.uAlpha, a); gl.drawArrays(gl.TRIANGLES, 0, 3); }
  gl.disable(gl.BLEND);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, scene); gl.generateMipmap(gl.TEXTURE_2D);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, W, H);
  gl.useProgram(post.p);
  gl.uniform1f(post.u.uT, t);
  // A radial zoom blur and a darker, warmer frame under the presents line, as in the original.
  gl.uniform1f(post.u.uBlur, 0.06 * ramp(t, 28.6, 31.0));
  gl.uniform1f(post.u.uDark, 0.28 * ramp(t, 28.5, 31));
  gl.uniform1f(post.u.uGlow, 0.55);
  // Out of focus as it fades up from black.
  gl.uniform1f(post.u.uFocus, 0.85 * (1 - ramp(t, 8.4, 10.4)));
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.finish();

  // The presents line and the wash to white, on the 2D canvas above.
  ctx.clearRect(0, 0, W, H);
  const ta = Math.min(ramp(t, 30.2, 32.2), 1 - ramp(t, 37.9, 38.9));
  const white = ramp(t, 36.0, 37.6);
  const line = (fill, glow) => {
    ctx.font = PRESENT.font; ctx.letterSpacing = PRESENT.spacing; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    if (glow > 0) { ctx.shadowColor = `rgba(20,10,2,${glow})`; ctx.shadowBlur = 26; ctx.fillStyle = fill; ctx.fillText(PRESENT.text, W / 2, H / 2 + 6); ctx.shadowBlur = 8; }
    ctx.fillStyle = fill; ctx.fillText(PRESENT.text, W / 2, H / 2 + 6); ctx.shadowBlur = 0;
  };
  if (ta > 0) {
    ctx.save(); ctx.globalAlpha = ta;
    line(`rgb(${Math.round(lerp(242, 120, white))},${Math.round(lerp(230, 116, white))},${Math.round(lerp(204, 110, white))})`, 0.9 * (1 - white));
    ctx.restore();
  }
  // Into white.
  const wa = ramp(t, 35.9, 38.2);
  if (wa > 0) { ctx.save(); ctx.globalAlpha = wa; ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H); ctx.restore();
    if (ta > 0) { ctx.save(); ctx.globalAlpha = ta * 0.9; line('#8a857c', 0); ctx.restore(); } }
}

// ----------------------------------------------------------------------------------- rating card
function drawRating(t) {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  const a = Math.min(ramp(t, 0.1, 0.6), 1 - ramp(t, 5.0, 5.8));
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a;
  const s = 330, x = W / 2 - s / 2, y = H / 2 - s / 2 - 60;
  ctx.fillStyle = '#2fa24a'; ctx.beginPath(); ctx.roundRect(x, y, s, s, 46); ctx.fill();
  ctx.fillStyle = '#ffffff'; ctx.font = '900 138px Cinzel'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('ALL', W / 2, y + s / 2 + 8);
  ctx.font = `bold 60px "Apple SD Gothic Neo", sans-serif`; ctx.fillText('전체이용가', W / 2, y + s + 74);
  ctx.restore();
}

// ----------------------------------------------------------------------------------- logo
function drawLogo(t) {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  const lw = 1480, lh = lw * LOGO.height / LOGO.width; const lx = W / 2 - lw / 2, ly = H / 2 - lh / 2;
  const p = ramp(t, 163.12, 165.1); // burn-in progress
  const out = 1 - ramp(t, 170.9, 172.2);
  if (out <= 0) return;
  // A warm flare behind the emblem as it ignites.
  const flare = Math.exp(-Math.max(0, t - 165.0) * 1.3) * ramp(t, 163.8, 165.0) * out;
  if (flare > 0.01) {
    const gr = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, 900); gr.addColorStop(0, `rgba(255,190,90,${0.85 * flare})`); gr.addColorStop(0.4, `rgba(255,110,30,${0.35 * flare})`); gr.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
  }
  // Burn the logo in through a noise threshold with a glowing edge.
  const nw = LOGO_NOISE.width, nh = LOGO_NOISE.height;
  const mask = canvas(nw, nh); const mg = mask.getContext('2d'); const md = mg.createImageData(nw, nh);
  const edge = canvas(nw, nh); const eg = edge.getContext('2d'); const ed = eg.createImageData(nw, nh);
  const nd = LOGO_NOISE.data; const thr = lerp(0.08, 1.08, p);
  for (let k = 0, q = 0; k < nd.length; k++, q += 4) {
    const v = nd[k];
    md.data[q + 3] = v < thr ? 255 : 0;
    const e = 1 - Math.abs(v - thr) / 0.07; if (e > 0 && p < 1) { ed.data[q] = 255; ed.data[q + 1] = 150 + 80 * e; ed.data[q + 2] = 60; ed.data[q + 3] = 255 * e; }
  }
  mg.putImageData(md, 0, 0); eg.putImageData(ed, 0, 0);
  const L = canvas(lw, lh); const lg = L.getContext('2d');
  lg.drawImage(LOGO, 0, 0, lw, lh); lg.globalCompositeOperation = 'destination-in'; lg.filter = 'blur(2px)'; lg.drawImage(mask, 0, 0, lw, lh);
  const scale = lerp(1.06, 1.0, smooth(ramp(t, 163.1, 166)));
  ctx.save(); ctx.globalAlpha = out; ctx.translate(W / 2, H / 2); ctx.scale(scale, scale); ctx.translate(-W / 2, -H / 2);
  ctx.drawImage(L, lx, ly);
  // The edge glow, only over the logo's own shape.
  const E = canvas(lw, lh); const egc = E.getContext('2d'); egc.filter = 'blur(6px)'; egc.drawImage(edge, 0, 0, lw, lh); egc.filter = 'none'; egc.globalCompositeOperation = 'destination-in'; egc.drawImage(LOGO, 0, 0, lw, lh);
  ctx.globalCompositeOperation = 'lighter'; ctx.drawImage(E, lx, ly); ctx.drawImage(E, lx, ly);
  // The letters blaze as the fire passes, then settle.
  if (flare > 0.02) {
    const B = canvas(lw, lh); const bg = B.getContext('2d'); bg.filter = 'blur(10px)'; bg.drawImage(L, 0, 0); bg.filter = 'none';
    bg.globalCompositeOperation = 'source-in'; bg.fillStyle = 'rgb(255,170,70)'; bg.fillRect(0, 0, lw, lh);
    ctx.globalAlpha = out * flare * 0.5; ctx.drawImage(B, lx, ly); ctx.globalAlpha = out;
  }
  // A slow light sweep across the gold while it holds.
  const sw = ramp(t, 165.3, 168.3);
  if (sw > 0 && sw < 1) {
    const S = canvas(lw, lh); const sg = S.getContext('2d'); const sx = lerp(-0.3, 1.3, sw) * lw;
    const gr = sg.createLinearGradient(sx - 160, 0, sx + 160, lh); gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(0.5, 'rgba(255,240,200,0.55)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    sg.fillStyle = gr; sg.fillRect(0, 0, lw, lh); sg.globalCompositeOperation = 'destination-in'; sg.drawImage(LOGO, 0, 0, lw, lh);
    ctx.drawImage(S, lx, ly);
  }
  ctx.restore();
}

// ----------------------------------------------------------------------------------- entry points
window.cardsInit = async (islands) => {
  await document.fonts.load('500 30px Cinzel'); await document.fonts.load('900 138px Cinzel');
  LOGO = await img('/art/logo.webp');
  GL = initGL(islands);
  // The presents line, sized like the original's (about 80 % of the width, wide-spaced small caps:
  // Cinzel's lower case is small caps).
  const text = 'Inhyuk Seo  &  Inkeun Seo  Present', font = '500 56px Cinzel';
  let sp = 0; ctx.font = font; for (; sp < 60; sp += 0.5) { ctx.letterSpacing = `${sp}px`; if (ctx.measureText(text).width > W * 0.79) break; }
  PRESENT = { text, font, spacing: `${sp}px` };
  ctx.letterSpacing = '0px';
  // Burn-in noise for the logo, at a quarter of its drawn size.
  const logo = LOGO; const nw = 300, nh = Math.round(nw * logo.height / logo.width); const nz = makeNoise(9); const data = new Float32Array(nw * nh);
  for (let j = 0; j < nh; j++) for (let i = 0; i < nw; i++) { const dx = (i - nw / 2) / nw, dy = (j - nh / 2) / nw; data[j * nw + i] = 0.55 * Math.hypot(dx, dy) * 1.6 + 0.45 * nz(i * 0.04, j * 0.04); }
  LOGO_NOISE = { width: nw, height: nh, data };
  return true;
};
/** Draw the frame at song time t (seconds). */
window.renderAt = (t) => {
  const map = t >= 7.5 && t < 40;
  glc.style.visibility = map ? 'visible' : 'hidden';
  if (t < 7.5) drawRating(t);
  else if (map) drawMap(t);
  else drawLogo(t);
};
</script>
</body>
