<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Tribute cards</title>
<!--
  The tribute's 2D cards as a pure function of song time: the rating card, the painted parchment map
  of the six worlds and the logo. tools/cinema/tribute/cards.mjs opens this page on the dev server, hands
  it the islands (tools/cinema/tribute/islands.mjs: the worlds' real ground heights) and records frames
  with renderAt(t). The map is a WebGL2 shader on #g (painted from the worlds' coasts and heights); the
  cards and the map's titles are drawn on the 2D canvas #c above it.
-->
<style>
  @font-face { font-family: 'Cinzel'; font-weight: 400 900; src: url('/fonts/cinzel-latin-wght.woff2') format('woff2'); }
  html, body { margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; position: absolute; left: 0; top: 0; }
</style>
</head>
<body>
<canvas id="g" width="1920" height="872"></canvas>
<canvas id="c" width="1920" height="872"></canvas>
<script type="module">
const W = 1920, H = 872;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const glc = document.getElementById('g');
const KO = '"Apple SD Gothic Neo", "Pretendard", sans-serif';

// ----------------------------------------------------------------------------------- helpers
const clamp01 = (x) => (x < 0 ? 0 : x > 1 ? 1 : x);
const smooth = (x) => { x = clamp01(x); return x * x * (3 - 2 * x); };
const lerp = (a, b, k) => a + (b - a) * k;
const ramp = (t, a, b) => smooth((t - a) / (b - a));
function mulberry(seed) { let a = seed >>> 0; return () => { a = (a + 0x6d2b79f5) >>> 0; let x = a; x = Math.imul(x ^ (x >>> 15), x | 1); x ^= x + Math.imul(x ^ (x >>> 7), x | 61); return ((x ^ (x >>> 14)) >>> 0) / 4294967296; }; }
function canvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
const img = (src) => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });

// Value noise and fbm on a lattice (seeded), for coast warps and textures.
function makeNoise(seed) {
  const r = mulberry(seed); const P = new Float32Array(256 * 256); for (let i = 0; i < P.length; i++) P[i] = r();
  const at = (x, y) => P[((y & 255) << 8) | (x & 255)];

    return lerp(lerp(at(xi, yi), at(xi + 1, yi), u), lerp(at(xi, yi + 1), at(xi + 1, yi + 1), u), v); };
  return (x, y, oct = 4) => { let s = 0, a = 0.5, f = 1; for (let i = 0; i < oct; i++) { s += a * n(x * f, y * f); f *= 2.03; a *= 0.5; } return s; };
}

// ----------------------------------------------------------------------------------- the map
// A painted parchment map. cardsInit builds a signed distance field of the land (map px, + on land)
// from the worlds' sampled coasts and a few drawn capes, an elevation field (real heights plus
// mountain ranges) and a label layer (the two continents' names, ink mountains). A WebGL2 shader
// paints mottled orange-gold land with a dark coastline, water lines off the coast, a mottled
// grey-teal sea and the turning ink maelstrom; a post pass softens it and adds glow, zoom blur,
// vignette and grain. The sea is procedural and unbounded: no view shows past the sheet.
const MW = 4400, MH = 2000; // map space (px)
const GS = 2, GW = MW / GS, GH = MH / GS; // field grid: one cell per 2 map px
const SWIRL = { x: 1810, y: 975, r: 250 };

// The two continents' outlines (map px), drawn after the original map: Clawhaven tall in the west
// with a north-east arm, the east continent (Frostlight joined to Starhaven) with a hooked north.
const WEST = [[960, 240], [1080, 250], [1170, 330], [1230, 420], [1330, 440], [1450, 430], [1530, 480], [1500, 560], [1390, 590],
  [1420, 700], [1450, 900], [1450, 1200], [1430, 1450], [1330, 1560], [1200, 1640], [1120, 1760], [1000, 1840], [900, 1830],
  [840, 1720], [760, 1600], [640, 1480], [560, 1330], [540, 1150], [570, 960], [560, 800], [620, 620], [700, 470], [820, 330]];
const EAST = [[2640, 140], [2800, 80], [3000, 70], [3200, 110], [3340, 210], [3380, 360], [3320, 520], [3240, 650], [3180, 780],
  [3170, 870], [3200, 960], [3290, 1050], [3350, 1200], [3370, 1380], [3320, 1540], [3220, 1650], [3080, 1720], [2900, 1740],
  [2790, 1680], [2700, 1560], [2680, 1400], [2730, 1250], [2770, 1120], [2800, 1000], [2790, 920], [2730, 860], [2680, 760],
  [2640, 640], [2560, 560], [2500, 460], [2540, 380], [2600, 300], [2600, 220]];
// Worlds in map space: centre, scale (map px per world unit), rotation, stretch, coast warp (world
// units), elevation scale. Clawhaven is its real land (east coast, voyage islands) inside WEST;
// Frostlight and Starhaven lie in EAST and give it relief; the rest are islands between and south.
const WORLDS = [
  { c: 1, x: 880, y: 1000, s: 2.3, rot: 0, warp: 10, seed: 11, clip: WEST, elev: 1 / 50 },
  { c: 4, x: 2960, y: 430, s: 1.7, rot: -0.12, warp: 30, seed: 41, sx: 1.3, sy: 0.9, elev: 1 / 24 },
  { c: 2, x: 3030, y: 1360, s: 1.6, rot: 0.18, warp: 30, seed: 21, sx: 1.02, sy: 1.18, elev: 1 / 13 },
  { c: 3, x: 2130, y: 1470, s: 0.9, rot: 1.1, warp: 40, seed: 31, sx: 1.25, sy: 0.7, elev: 1 / 26 },
  { c: 6, x: 2480, y: 1580, s: 0.75, rot: -0.7, warp: 44, seed: 61, sx: 0.8, sy: 1.25, elev: 1 / 26 },
  { c: 5, x: 1600, y: 1720, s: 0.85, rot: 2.2, warp: 70, seed: 51, sx: 1.5, sy: 0.6, elev: 1 / 26 },
];
// Drawn land (+) and sea (-): a lake, bays and islets. [sign, x1, y1, x2, y2, width] is a capsule;
// a zero-length one is a disc.
const SHAPES = [
  ['-', 3040, 400, 3040, 400, 30], ['-', 3170, 1460, 3170, 1460, 20], ['-', 520, 1240, 600, 1200, 50],
  ['+', 1480, 1400, 1480, 1400, 40], ['+', 1380, 1680, 1380, 1680, 34], ['+', 2330, 1300, 2330, 1300, 36],
  ['+', 2580, 1340, 2580, 1340, 30], ['+', 2000, 1730, 2000, 1730, 30], ['+', 1770, 1560, 1770, 1560, 26],
  ['+', 3480, 1500, 3480, 1500, 34], ['+', 400, 640, 400, 640, 30], ['+', 1250, 190, 1250, 190, 34],
  ['+', 2420, 900, 2420, 900, 28], ['+', 3460, 760, 3460, 760, 30],
];
// Mountain ranges as polylines (map px): raised in the elevation field and marked with ink peaks.
const RANGES_M = [
  [[860, 330], [740, 560], [700, 820], [720, 1100], [800, 1380], [900, 1650]],
  [[1080, 380], [1250, 470], [1420, 500]],
  [[1080, 1250], [1150, 1450], [1060, 1620]],
  [[2620, 260], [2820, 200], [3100, 220], [3290, 330]],
  [[2700, 560], [2900, 700], [3150, 640]],
  [[2900, 1150], [2860, 1400], [2950, 1620]],
];
// The names, written in one by one as in the original (Kalimdor; the Eastern Kingdoms, Ironforge and Stormwind
// with their stars, Khaz Modan): [text, x, y, size, fade in from, to (song s), star]. The east continent's two
// starred cities are its worlds' capitals, the throne of Frostlight in the north and Starhaven's harbour south.
const LABELS = [
  ['클로헤이븐', 990, 950, 78, 14.22, 14.72],
  ['서리빛 설원', 2832, 940, 78, 20.5, 21.25],
  ['얼음 왕좌', 2931, 729, 44, 21.88, 22.3, true],
  ['별빛 항구', 3018, 1152, 44, 22.58, 22.98, true],
  ['서리 소나무 숲', 3050, 540, 54, 23.18, 23.65],
];
const NL = LABELS.length;

const SKW = 4096, SKH = 2048; // the globe's skin (the map baked equirectangular)

let GL = null, LOGO = null, LG = null, PRESENT = null;

/** Squared distance transform of one row (Felzenszwalb and Huttenlocher). */
function edt1(f, n, d, v, z) {
  let k = 0; v[0] = 0; z[0] = -1e30; z[1] = 1e30;
  for (let q = 1; q < n; q++) {
    let s = ((f[q] + q * q) - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]);
    while (s <= z[k]) { k--; s = ((f[q] + q * q) - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]); }
    k++; v[k] = q; z[k] = s; z[k + 1] = 1e30;
  }
  k = 0;
  for (let q = 0; q < n; q++) { while (z[k + 1] < q) k++; d[q] = (q - v[k]) * (q - v[k]) + f[v[k]]; }
}
/** Distance (cells) from every cell to the nearest cell whose mask equals `target`. */
function edt(mask, w, h, target) {
  const g = new Float64Array(w * h); for (let i = 0; i < w * h; i++) g[i] = mask[i] === target ? 0 : 1e20;
  const n = Math.max(w, h); const f = new Float64Array(n), d = new Float64Array(n), v = new Int32Array(n), z = new Float64Array(n + 1);
  for (let x = 0; x < w; x++) { for (let y = 0; y < h; y++) f[y] = g[y * w + x]; edt1(f, h, d, v, z); for (let y = 0; y < h; y++) g[y * w + x] = d[y]; }
  for (let y = 0; y < h; y++) { for (let x = 0; x < w; x++) f[x] = g[y * w + x]; edt1(f, w, d, v, z); for (let x = 0; x < w; x++) g[y * w + x] = Math.sqrt(d[x]); }
  return g;
}
/** Separable box blur of a float grid, `passes` times (close to a gaussian). */
function boxBlur(a, w, h, r, passes = 2) {
  const t = new Float32Array(w * h);
  for (let p = 0; p < passes; p++) {
    for (let y = 0; y < h; y++) { let s = 0; const o = y * w; for (let x = -r; x <= r; x++) s += a[o + Math.min(w - 1, Math.max(0, x))];
      for (let x = 0; x < w; x++) { t[o + x] = s / (2 * r + 1); s += a[o + Math.min(w - 1, x + r + 1)] - a[o + Math.max(0, x - r)]; } }
    for (let x = 0; x < w; x++) { let s = 0; for (let y = -r; y <= r; y++) s += t[Math.min(h - 1, Math.max(0, y)) * w + x];
      for (let y = 0; y < h; y++) { a[y * w + x] = s / (2 * r + 1); s += t[Math.min(h - 1, y + r + 1) * w + x] - t[Math.max(0, y - r) * w + x]; } }
  }
  return a;
}

/** A test for grid cells inside a polygon (map px). */
function polyMask(poly) {
  const c = canvas(GW, GH); const g = c.getContext('2d'); g.scale(1 / GS, 1 / GS); g.fillStyle = '#fff';
  g.beginPath(); poly.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y))); g.closePath(); g.fill();
  const d = g.getImageData(0, 0, GW, GH).data; return (gx, gy) => d[(gy * GW + gx) * 4 + 3] > 127;
}
/** Land mask and elevation on the field grid, then the signed distance field. */
function buildField(data) {
  const N = GW * GH; const land = new Uint8Array(N); const elev = new Float32Array(N);
  for (const def of WORLDS) {
    const d = data[def.c]; const n = d.n, hgt = d.h, noise = makeNoise(def.seed);
    const inClip = def.clip ? polyMask(def.clip) : null;
    const sx = def.sx ?? 1, sy = def.sy ?? 1, cos = Math.cos(def.rot), sin = Math.sin(def.rot);
    const half = (n - 1) * d.step / 2 * def.s * Math.max(sx, sy) * 1.5;
    const gx0 = Math.max(0, Math.floor((def.x - half) / GS)), gx1 = Math.min(GW - 1, Math.ceil((def.x + half) / GS));
    const gy0 = Math.max(0, Math.floor((def.y - half) / GS)), gy1 = Math.min(GH - 1, Math.ceil((def.y + half) / GS));
    for (let gy = gy0; gy <= gy1; gy++) for (let gx = gx0; gx <= gx1; gx++) {
      const u = ((gx + 0.5) * GS - def.x) / def.s, v = ((gy + 0.5) * GS - def.y) / def.s;
      const ru = (u * cos + v * sin) / sx, rv = (-u * sin + v * cos) / sy;
      const wu = ru + (noise(ru * 0.02, rv * 0.02) - 0.5) * def.warp * 2 + (noise(ru * 0.08 + 9, rv * 0.08) - 0.5) * def.warp * 0.6;
      const wv = rv + (noise(ru * 0.02 + 5, rv * 0.02 + 3) - 0.5) * def.warp * 2 + (noise(ru * 0.08, rv * 0.08 + 7) - 0.5) * def.warp * 0.6;
      const fi = (wu - d.x0) / d.step, fj = (wv - d.z0) / d.step;
      const inTile = fi >= 0 && fj >= 0 && fi <= n - 1 && fj <= n - 1;
      if (!inTile && !def.clip) continue;
      let hv = 0;
      if (inTile) { const i0 = Math.min(n - 2, Math.floor(fi)), j0 = Math.min(n - 2, Math.floor(fj)), a = fi - i0, b = fj - j0;
        hv = lerp(lerp(hgt[j0 * n + i0], hgt[j0 * n + i0 + 1], a), lerp(hgt[(j0 + 1) * n + i0], hgt[(j0 + 1) * n + i0 + 1], a), b); }
      let isLand = hv > 0.02;
      // Clawhaven: the outline everywhere but its real east coast and voyage islands (the sampled
      // square's other edges are only the world's bounds).
      if (def.clip) isLand = (inClip(gx, gy) && !(hv <= 0.02 && wu > 60 && wu < 330 && wv > -170 && wv < 230)) || (hv > 0.02 && wu > 170);
      if (isLand) { const k = gy * GW + gx; land[k] = 1; elev[k] = Math.max(elev[k], clamp01(hv * def.elev)); }
    }
  }
  // The east continent, then drawn lakes, bays and islets.
  const inEast = polyMask(EAST);
  for (let gy = 0; gy < GH; gy++) for (let gx = 0; gx < GW; gx++) { const k = gy * GW + gx; if (inEast(gx, gy) && !land[k]) { land[k] = 1; elev[k] = 0.1; } }
  const add = canvas(GW, GH), cut = canvas(GW, GH); const ag = add.getContext('2d'), cg = cut.getContext('2d');
  for (const g of [ag, cg]) { g.lineCap = 'round'; g.strokeStyle = '#fff'; g.scale(1 / GS, 1 / GS); }
  for (const [sign, x1, y1, x2, y2, w] of SHAPES) { const g = sign === '+' ? ag : cg; g.lineWidth = w * 2; g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2 + 0.01, y2); g.stroke(); }
  const ad = ag.getImageData(0, 0, GW, GH).data, cd = cg.getImageData(0, 0, GW, GH).data;
  for (let k = 0; k < N; k++) { if (ad[k * 4 + 3] > 127 && !land[k]) { land[k] = 1; elev[k] = 0.08; } if (cd[k * 4 + 3] > 127) land[k] = 0; }
  // Mountain ranges: soft ridges in the elevation.
  const rc = canvas(GW, GH); const rg = rc.getContext('2d'); rg.scale(1 / GS, 1 / GS); rg.filter = `blur(${40 / GS}px)`;
  rg.strokeStyle = '#fff'; rg.lineCap = rg.lineJoin = 'round'; rg.lineWidth = 120;
  for (const pl of RANGES_M) { rg.beginPath(); pl.forEach(([x, y], i) => (i ? rg.lineTo(x, y) : rg.moveTo(x, y))); rg.stroke(); }
  const rd = rg.getImageData(0, 0, GW, GH).data;
  for (let k = 0; k < N; k++) elev[k] = land[k] ? clamp01(elev[k] * 0.7 + 0.75 * rd[k * 4 + 3] / 255) : 0;
  boxBlur(elev, GW, GH, 6);
  // Signed distance (map px): + inside land.
  const toSea = edt(land, GW, GH, 0), toLand = edt(land, GW, GH, 1);
  const out = new Float32Array(N * 2);
  for (let k = 0; k < N; k++) { const sd = land[k] ? toSea[k] - 0.5 : -(toLand[k] - 0.5); out[k * 2] = Math.max(-700, Math.min(700, sd * GS)); out[k * 2 + 1] = elev[k]; }
  // Keep the sheet's border open sea, so clamped lookups outside the map stay sea.
  for (let gy = 0; gy < GH; gy++) for (let gx = 0; gx < GW; gx++) if (gx === 0 || gy === 0 || gx === GW - 1 || gy === GH - 1) { out[(gy * GW + gx) * 2] = -700; out[(gy * GW + gx) * 2 + 1] = 0; }
  return { field: out, land };
}

/** A name in gothic (and a city's four-point star, up and left of it) with its corners rounded (blur, then
 *  threshold back), as a signed distance field: a canvas whose red is 0.5 + d / 24 (d: map px from the
 *  letters' edge, + inside). cx, cy: the name's centre in it. */
const NAME_RANGE = 12;
function roundedName(s, size, star) {
  const font = `700 ${size}px ${KO}`, sp = Math.round(size * 0.4), pad = Math.ceil(size * 0.3) + NAME_RANGE;
  const m = canvas(8, 8).getContext('2d'); m.font = font; m.letterSpacing = `${sp}px`;
  const tw = Math.ceil(m.measureText(s).width), w = tw + pad * 2, h = Math.ceil(size * 1.2) + pad * 2 + (star ? Math.ceil(size * 1.05) : 0);
  const cx = w / 2, cy = star ? h - pad - size * 0.6 : h / 2;
  const a = canvas(w, h); const ag = a.getContext('2d', { willReadFrequently: true });
  ag.font = font; ag.letterSpacing = `${sp}px`; ag.textAlign = 'center'; ag.textBaseline = 'middle'; ag.fillStyle = '#fff';
  ag.filter = `blur(${(size * 0.035).toFixed(1)}px)`; ag.fillText(s, cx + sp / 2, cy);
  if (star) { // long points up and down, pinched waist
    const x = cx - 0.2 * tw, y = cy - size * 1.12, v = size * 0.5, u = size * 0.34, c = size * 0.06;
    ag.beginPath(); ag.moveTo(x, y - v); ag.quadraticCurveTo(x + c, y - c, x + u, y); ag.quadraticCurveTo(x + c, y + c, x, y + v);
    ag.quadraticCurveTo(x - c, y + c, x - u, y); ag.quadraticCurveTo(x - c, y - c, x, y - v); ag.fill();
  }
  const d = ag.getImageData(0, 0, w, h); const mask = new Uint8Array(w * h);
  for (let i = 0; i < w * h; i++) mask[i] = d.data[i * 4 + 3] > 118 ? 1 : 0;
  const toOut = edt(mask, w, h, 0), toIn = edt(mask, w, h, 1);
  for (let i = 0; i < w * h; i++) {
    const sd = mask[i] ? toOut[i] - 0.5 : -(toIn[i] - 0.5);
    d.data[i * 4] = Math.round(255 * clamp01(0.5 + sd / (2 * NAME_RANGE))); d.data[i * 4 + 1] = d.data[i * 4 + 2] = 0; d.data[i * 4 + 3] = 255;
  }

  return { c: a, cx, cy };
}
/** Each name's box (map px), where the shader fades that name in. */
const LABEL_BOX = new Float32Array(NL * 4);
/** The label layer at map resolution: red the names' distance field, green ink (the mountains' strokes and
 *  the drawings in the sea), blue the mountains' lit slopes. */
function buildLabels(land) {
  const c = canvas(MW, MH); const g = c.getContext('2d');
  g.fillStyle = '#000'; g.fillRect(0, 0, MW, MH); g.globalCompositeOperation = 'lighter';
  const boxes = [];
  LABELS.forEach(([s, x, y, size, , , star], i) => {
    const { c: f, cx, cy } = roundedName(s, size, star);
    const x0 = Math.round(x - cx), y0 = Math.round(y - cy);
    g.drawImage(f, x0, y0);
    LABEL_BOX.set([x0, y0, x0 + f.width, y0 + f.height], i * 4);
    boxes.push([x0, y0 + size * 0.2, x0 + f.width, y0 + f.height - size * 0.2]);
  });
  // Mountains: sparse clusters of thin chevrons along the ranges, drawn in ink (only on land, off the names).
  const r = mulberry(77); const onLand = (x, y) => land[Math.floor(y / GS) * GW + Math.floor(x / GS)] === 1;
  const free = (x, y) => !boxes.some(([x0, y0, x1, y1]) => x > x0 - 40 && x < x1 + 40 && y > y0 - 40 && y < y1 + 40);
  const peaks = [];
  for (const pl of RANGES_M) for (let i = 1; i < pl.length; i++) {
    const [x0, y0] = pl[i - 1], [x1, y1] = pl[i]; const len = Math.hypot(x1 - x0, y1 - y0);
    for (let d = r() * 60; d < len; d += 70 + r() * 90) {
      const k = d / len; const cx = lerp(x0, x1, k) + (r() - 0.5) * 140, cy = lerp(y0, y1, k) + (r() - 0.5) * 140;
      for (let j = 0, n = 3 + Math.floor(r() * 5); j < n; j++) {
        const x = cx + (r() - 0.5) * 130, y = cy + (r() - 0.5) * 80, s = 16 + r() * 16;
        if (onLand(x - s, y) && onLand(x + s, y) && onLand(x, y - 40) && onLand(x, y + 40) && free(x, y)) peaks.push([x, y, s, r()]);
      }

  }

  for (const [x, y, s] of peaks) { // the lit (west) slope
    g.beginPath(); g.moveTo(x - s * 1.05, y + s * 0.5); g.lineTo(x - s * 0.1, y - s * 0.62); g.lineTo(x + s * 0.1, y + s * 0.5); g.closePath(); g.fill();
  }
  g.filter = 'blur(0.7px)'; g.strokeStyle = '#0f0'; g.lineWidth = 3.2;
  for (const [x, y, s, q] of peaks) {
    g.beginPath(); g.moveTo(x - s * 1.05, y + s * 0.5); g.lineTo(x - s * 0.1, y - s * 0.62);
    if (q < 0.5) { g.lineTo(x + s * 0.35, y - s * 0.1); g.lineTo(x + s * 0.6, y - s * 0.32); }
    g.lineTo(x + s * 1.05, y + s * 0.5); g.stroke();
    g.beginPath(); g.moveTo(x - s * 0.1, y - s * 0.62); g.lineTo(x + s * 0.08, y + s * 0.05); g.stroke(); // the shaded ridge
  }
  // The drawings in the sea off the east continent, as the original's: a galleon at lower left, a dragon at right.
  drawShip(g, 1695, 1385, 1.8);
  drawDragon(g, 3590, 1230, 1.45);
  return c;
}

/** Ink line art on the label layer (green, added): `fn` draws in local units round (x, y) within 160 units,

function compile(gl, vs, fs) {

  const p = gl.createProgram(); gl.attachShader(p, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs));

  const u = {}; const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const name = gl.getActiveUniform(p, i).name; u[name] = gl.getUniformLocation(p, name); }
  return { p, u };
}

// Camera over the map at song time t: centre (map px) and zoom (output px per map px).
const FULL = W / MW;
const MAP_IN = 6.3; // the map starts out of black under the end of the rating card's range
// Its fade, matched to the original's brightness (mean luma, frame by frame): a faint toe, then rising to full
// at 9.4 s.
const mapIn = (t) => Math.max(0.07 * clamp01((t - MAP_IN) / 1.2), Math.pow(clamp01((t - 6.4) / 3.0), 2.8));
const VIEWS = {
  full: (t) => ({ x: lerp(2080, 1960, ramp(t, 9, 14)), y: 990, z: FULL * lerp(1.02, 1.17, ramp(t, 8, 14)) }),
  west: (t) => ({ x: lerp(1300, 1360, ramp(t, 13.6, 20)), y: lerp(930, 1040, ramp(t, 13.6, 20)), z: FULL * lerp(2.3, 2.45, ramp(t, 13.6, 20)) }),
  east: (t) => { const w = VIEWS.west(19.2); const k = ramp(t, 19.2, 20.9);
    return { x: lerp(w.x, 2720, k), y: lerp(w.y, 960, k), z: FULL * lerp(w.z / FULL, lerp(2.0, 1.82, ramp(t, 20.9, 27.5)), k) }; },
  end: (t) => ({ x: 1980, y: 990, z: FULL * lerp(1.12, 1.0, ramp(t, 27.5, 39.5)) }),

function drawMap(t) {
  const { gl, fbo, scene, map, post } = GL;
  // Dissolves between the camera's views, as the original does: full view out of black, then
  // closer on Clawhaven, a pan east across the other worlds, and back to the full view.
  const layers = [];
  if (t >= 13.6 && t < 19.2) layers.push([VIEWS.west(t), 1]);
  if (t >= 19.2) layers.push([VIEWS.east(t), 1]);
  layers.push([VIEWS.full(t), Math.min(mapIn(t), 1 - ramp(t, 13.6, 14.4))]);
  if (t >= 27.4) layers.push([VIEWS.end(t), ramp(t, 27.4, 29.4)]);
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo); gl.viewport(0, 0, W, H);
  gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.useProgram(map.p); gl.enable(gl.BLEND); gl.blendFuncSeparate(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA, gl.ZERO, gl.ONE);
  gl.uniform1f(map.u.uT, t);

  gl.uniform1f(map.u.uLabA, 1); gl.uniform1fv(map.u['uLabAl[0]'], LABELS.map((l) => ramp(t, l[4], l[5])));

/** Piecewise linear through [[t, v], ...], held flat outside. */

/** Heat (0..1) of the lower word at logo x: white as the front passes, cooling, then the blaze. */
function heatAt(x, t, front) {

  gl.drawArrays(gl.TRIANGLES, 0, 3); gl.finish();
  ctx.save(); ctx.globalAlpha = a;
  const rd = R * (1 + blur * 0.5), dk = ctx.createRadialGradient(cx, cy, rd * 0.9, cx, cy, rd * 1.35);
  dk.addColorStop(0, 'rgba(0,0,0,1)'); dk.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = dk; ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'lighter'; ctx.drawImage(glc, 0, 0);
  ctx.restore();
}

function drawLogo(t) {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  const out = 1 - ramp(t, 171.75, 172.4);
  if (out <= 0) return;
  const up = ramp(t, 163.32, 163.62) * out; // the frame, the crab and "WORLD OF"
  const front = lerp(FX0, FX1, clamp01((t - F0) / (F1 - F0)));
  const bl = blaze(t), rays = ramp(t, 164.45, 164.8) * (1 - ramp(t, 165.55, 166.0)) * out;
  const fl = ramp(t, F0, F0 + 0.1) * (1 - ramp(t, F1 - 0.05, F1 + 0.15)) * out; // the flare on the front
  const sc = lerp(1.035, 1, smooth(ramp(t, 163.3, 166.5)));
  const sx = (x) => W / 2 + (LX + x * LS - W / 2) * sc, sy = (y) => H / 2 + (LY + y * LS - H / 2) * sc;
  // The rays burst from the front, then from the word's middle as it blazes.
  const rx = sx(lerp(Math.min(Math.max(front, 300), 1300), 800, ramp(t, 165.05, 165.45))), ry = sy(WORD_Y);
  if (rays > 0.002) drawRays(t, rx, ry, rays);
  ctx.save(); ctx.translate(W / 2, H / 2); ctx.scale(sc, sc); ctx.translate(-W / 2, -H / 2);
  if (t >= 166.05 || up <= 0) { ctx.globalAlpha = up; if (up > 0) ctx.drawImage(LOGO, LX, LY, LW, LH); }
  else {
    ctx.globalAlpha = up; ctx.drawImage(LG.bare, LX, LY);
    // The lower word: cold and dark ahead of the front, forged behind it.
    const edge = (g, behind) => { const gr = g.createLinearGradient(front * LS - 28, 0, front * LS + 28, 0);
      gr.addColorStop(0, behind ? '#fff' : 'rgba(0,0,0,0)'); gr.addColorStop(1, behind ? 'rgba(0,0,0,0)' : '#fff'); return gr; };
    const cg = layer(0); cg.drawImage(LG.cold, 0, 0); cg.globalCompositeOperation = 'destination-in'; cg.fillStyle = edge(cg, false); cg.fillRect(0, 0, LW, LH);
    ctx.drawImage(SCR[0], LX, LY);
    if (front > FORGE[0][0]) {
      const rg = layer(1); rg.drawImage(LG.word, 0, 0); rg.globalCompositeOperation = 'destination-in'; rg.fillStyle = edge(rg, true); rg.fillRect(0, 0, LW, LH);
      ctx.drawImage(SCR[1], LX, LY);
      // Heat over the forged letters (by their brightness, so the plate stays darker), white to
      // orange to their own colours, with its bloom.
      const hg = layer(2); hg.drawImage(LG.lum, 0, 0); hg.globalCompositeOperation = 'multiply';
      const gr = hg.createLinearGradient(FX0 * LS, 0, FX1 * LS, 0);
      for (let i = 0; i <= 48; i++) { const x = lerp(FX0, FX1, i / 48); gr.addColorStop(i / 48, hotColor(heatAt(x, t, front))); }
      hg.fillStyle = gr; hg.fillRect(0, 0, LW, LH);
      hg.globalCompositeOperation = 'destination-in'; hg.drawImage(SCR[1], 0, 0);
      ctx.globalCompositeOperation = 'lighter';
      ctx.drawImage(SCR[2], LX, LY); ctx.drawImage(SCR[2], LX, LY);
      ctx.filter = 'blur(10px)'; ctx.drawImage(SCR[2], LX, LY);
      ctx.filter = 'blur(32px)'; ctx.globalAlpha = up * 1.0; ctx.drawImage(SCR[2], LX, LY);
      ctx.filter = 'blur(70px)'; ctx.globalAlpha = up * 0.9; ctx.drawImage(SCR[2], LX, LY);
      ctx.filter = 'none';
      // The fire's light on the frame above.
      const spill = Math.max(bl, 0.5 * rays) * 0.3;
      if (spill > 0.005) { ctx.globalAlpha = up * spill; ctx.filter = 'blur(6px)'; ctx.drawImage(LG.warm, LX, LY); ctx.filter = 'none'; }
      ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = up;
    }
    // "WORLD OF" written in letter by letter: each wiped in from its left, flaring white hot and cooling to its gold.
    for (const L of LG.letters) {
      const k = clamp01((t - L.t) / 0.07);
      if (k <= 0) continue;
      const h = Math.exp(-Math.max(0, t - L.t - 0.04) / 0.26);
      const wipe = (src, i) => { const g = layer(i, L.c.width, L.c.height); g.drawImage(src, 0, 0); if (k >= 1) return SCR[i];
        const e = lerp(-0.15, 1.15, k) * L.c.width, gr = g.createLinearGradient(e - 10, 0, e + 10, 0);
        gr.addColorStop(0, '#fff'); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.globalCompositeOperation = 'destination-in'; g.fillStyle = gr; g.fillRect(0, 0, L.c.width, L.c.height); return SCR[i]; };
      ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = up; ctx.drawImage(wipe(L.c, 6), LX + L.x, LY + L.y);
      if (h > 0.01) {
        const hot = wipe(L.hot, 7);
        ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.85 * h * up; ctx.drawImage(hot, LX + L.x, LY + L.y);
        ctx.filter = 'blur(7px)'; ctx.globalAlpha = h * up; ctx.drawImage(hot, LX + L.x, LY + L.y);
        ctx.filter = 'blur(22px)'; ctx.globalAlpha = 0.7 * h * up; ctx.drawImage(hot, LX + L.x, LY + L.y);
        ctx.filter = 'none'; ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = up;
      }
    }
  }
  // The flare on the fire front: a hot core and a long horizontal streak.
  if (fl > 0.002) {
    const fx = LX + front * LS, fy = LY + WORD_Y * LS;
    ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 1;
    const ell = (rx, ry, stops) => { ctx.save(); ctx.translate(fx, fy); ctx.scale(1, ry / rx); const g = ctx.createRadialGradient(0, 0, 0, 0, 0, rx);
      for (const [k, c] of stops) g.addColorStop(k, c); ctx.fillStyle = g; ctx.fillRect(-rx, -rx, 2 * rx, 2 * rx); ctx.restore(); };
    ell(260, 200, [[0, `rgba(255,250,236,${0.95 * fl})`], [0.25, `rgba(255,205,120,${0.55 * fl})`], [1, 'rgba(255,100,20,0)']]);
    ell(1000, 34, [[0, `rgba(255,236,200,${0.6 * fl})`], [0.4, `rgba(255,150,60,${0.25 * fl})`], [1, 'rgba(255,90,20,0)']]);
  }
  ctx.restore();
  // Rays across the logo too, fainter.
  if (rays > 0.002) { ctx.save(); ctx.globalAlpha = 0.35; ctx.globalCompositeOperation = 'lighter'; ctx.drawImage(SCR[5], 0, 0, W, H); ctx.restore(); }
  // The globe, on top, until it has settled into the emblem; a warm flash as it does.
  const ga = ramp(t, 163.08, 163.16) * (1 - ramp(t, 163.58, 163.95)) * out;
  if (ga > 0.002) drawGlobe(t, ga);
  const flash = ramp(t, 163.5, 163.68) * (1 - ramp(t, 163.68, 164.05)) * out;
  if (flash > 0.002) {
    const g = ctx.createRadialGradient(GLOBE.x, GLOBE.y, 0, GLOBE.x, GLOBE.y, GLOBE.r * 1.8);
    g.addColorStop(0, `rgba(255,230,170,${0.5 * flash})`); g.addColorStop(0.5, `rgba(255,170,80,${0.25 * flash})`); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); ctx.restore();
  }
}

// ----------------------------------------------------------------------------------- entry points
window.cardsInit = async (islands) => {
  await document.fonts.load('500 30px Cinzel'); await document.fonts.load('900 138px Cinzel');
  LOGO = await img('/art/logo.webp');
  GL = initGL(islands);
  // The presents line, sized like the original's (about 80 % of the width, wide-spaced small caps:
  // Cinzel's lower case is small caps).
  const text = 'Inhyuk Seo  &  Inkeun Seo  Present', font = '500 56px Cinzel';
  let sp = 0; ctx.font = font; for (; sp < 60; sp += 0.5) { ctx.letterSpacing = `${sp}px`; if (ctx.measureText(text).width > W * 0.79) break; }
  PRESENT = { text, font, spacing: `${sp}px` };
  ctx.letterSpacing = '0px';
  // The logo split for the forge: the frame with the lower word cut out, the word, the word cold.
  LS = LW / LOGO.width; LH = LW * LOGO.height / LOGO.width; LY = (H - LH) / 2;
  const mk = (fn) => { const c = canvas(LW, LH); fn(c.getContext('2d')); return c; };
  const mask = mk((g) => { g.filter = 'blur(2px)'; g.scale(LS, LS); g.fillStyle = '#fff'; g.beginPath(); FORGE.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y))); g.closePath(); g.fill(); });
  const cut = (op) => mk((g) => { g.drawImage(LOGO, 0, 0, LW, LH); g.globalCompositeOperation = op; g.drawImage(mask, 0, 0); });
  const word = cut('destination-in'), up = cut('destination-out');
  // Before the forge the word's plate is dim and out of focus: no letters to read yet.
  const cold = mk((g) => { g.filter = 'blur(22px) brightness(0.32) saturate(0.6)'; g.drawImage(word, 0, 0); g.filter = 'none'; g.globalCompositeOperation = 'destination-in'; g.drawImage(mask, 0, 0); });
  // The upper word lifted off its banner by colour (the gold letters, grown to take their dark rims) for its
  // writing in, one canvas per letter, and the banner bare under them (its red smeared into the holes).
  const ux0 = Math.floor((UPPER[0][0] - 14) * LS), ux1 = Math.ceil((UPPER[UPPER.length - 1][1] + 14) * LS);
  const uy0 = Math.floor(UPPER_Y[0] * LS), uy1 = Math.ceil(UPPER_Y[1] * LS), uw = ux1 - ux0, uh = uy1 - uy0;
  const ug = canvas(uw, uh).getContext('2d', { willReadFrequently: true }); ug.drawImage(LOGO, -ux0, -uy0, LW, LH); // above the lower word's cut
  const px = ug.getImageData(0, 0, uw, uh).data;
  const N = uw * uh, gold = new Uint8Array(N);
  for (let i = 0; i < N; i++) { const r = px[i * 4], gg = px[i * 4 + 1]; gold[i] = px[i * 4 + 3] > 0 && gg > 60 && gg > 0.4 * r ? 1 : 0; }
  const grow = (m, R) => { const o = new Uint8Array(N);
    for (let y = 0; y < uh; y++) for (let x = 0; x < uw; x++) { if (!m[y * uw + x]) continue;
      for (let dy = -R; dy <= R; dy++) for (let dx = -R; dx <= R; dx++) { const xx = x + dx, yy = y + dy;
        if (xx >= 0 && yy >= 0 && xx < uw && yy < uh && dx * dx + dy * dy <= R * R + 1) o[yy * uw + xx] = 1; } }
    return o; };
  // The letters' dark rims and shadows: darker than the red plate, near the gold.
  const near = grow(gold, 10), rim = new Uint8Array(N);
  for (let i = 0; i < N; i++) rim[i] = gold[i] || (near[i] && px[i * 4] < 78 && px[i * 4 + 1] < 40) ? 1 : 0;
  const hole = grow(rim, 2), glow = grow(gold, 1);
  const lettersD = new ImageData(uw, uh), glowD = new ImageData(uw, uh), cutD = new ImageData(new Uint8ClampedArray(px), uw, uh);
  for (let i = 0; i < N; i++) if (hole[i]) { for (let j = 0; j < 4; j++) lettersD.data[i * 4 + j] = px[i * 4 + j]; cutD.data[i * 4 + 3] = 0; }
  for (let i = 0; i < N; i++) if (glow[i]) glowD.data.set([255, 226, 170, 255], i * 4); // the hot letters: the gold only
  const holes = canvas(uw, uh); holes.getContext('2d').putImageData(cutD, 0, 0);
  const sm = canvas(uw, uh); const smg = sm.getContext('2d', { willReadFrequently: true }); smg.filter = 'blur(12px)'; smg.drawImage(holes, 0, 0);
  const smD = smg.getImageData(0, 0, uw, uh).data; // un-premultiplied: the mean colour round each hole
  const bareD = cutD;
  for (let i = 0; i < uw * uh; i++) if (hole[i]) { const a = smD[i * 4 + 3] > 2;
    bareD.data[i * 4] = a ? smD[i * 4] : 90; bareD.data[i * 4 + 1] = a ? smD[i * 4 + 1] : 12; bareD.data[i * 4 + 2] = a ? smD[i * 4 + 2] : 10; bareD.data[i * 4 + 3] = px[i * 4 + 3]; }
  const bare = mk((g) => { g.drawImage(up, 0, 0); g.clearRect(ux0, uy0, uw, uh); g.putImageData(bareD, ux0, uy0); });
  const lettersC = canvas(uw, uh); lettersC.getContext('2d').putImageData(lettersD, 0, 0);
  const glowC = canvas(uw, uh); glowC.getContext('2d').putImageData(glowD, 0, 0);
  const letters = UPPER.map(([a, b], i) => {
    const l = i ? (UPPER[i - 1][1] + a) / 2 : a - 14, r = i < UPPER.length - 1 ? (b + UPPER[i + 1][0]) / 2 : b + 14;
    const x0 = Math.floor(l * LS) - ux0, x1 = Math.ceil(r * LS) - ux0;
    const c = canvas(x1 - x0, uh); c.getContext('2d').drawImage(lettersC, -x0, 0);
    const hot = canvas(x1 - x0, uh); hot.getContext('2d').drawImage(glowC, -x0, 0);
    return { c, hot, x: ux0 + x0, y: uy0, t: UPPER_T[i] };
  });
  const warm = mk((g) => { g.drawImage(up, 0, 0); g.globalCompositeOperation = 'source-in'; g.fillStyle = 'rgb(255,140,50)'; g.fillRect(0, 0, LW, LH); });
  const lum = mk((g) => { g.filter = 'grayscale(1) contrast(1.3) brightness(1.5)'; g.drawImage(word, 0, 0); });
  LG = { word, up, cold, lum, warm, bare, letters };
  // The rays: mostly near the horizontal, as the original's burst out sideways.
  const r = mulberry(5);
  for (let i = 0; i < 44; i++) {
    const side = r() < 0.6, an = side ? (r() < 0.5 ? 0 : Math.PI) + (r() - 0.5) * 0.9 : r() * Math.PI * 2;
    RAYS.push({ an, len: 500 + 1100 * r(), w: 0.006 + 0.018 * r(), ph: r() * 6.28, sp: 2 + 5 * r() });
  }
  return true;
};
/** Draw the frame at song time t (seconds). */
window.renderAt = (t) => {
  const map = t >= MAP_IN && t < 40;
  glc.style.visibility = map ? 'visible' : 'hidden';
  if (map) drawMap(t);
  if (t < 7.5) drawRating(t, map);
  else if (!map) drawLogo(t);
};
</script>
