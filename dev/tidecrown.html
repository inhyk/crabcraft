<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tidecrown studio</title>
    <style>
      body { margin: 0; background: #1a1512; overflow: hidden; color: #f3e6c8; font: 13px/1.35 system-ui, sans-serif; }
      #panel { position: absolute; left: 12px; top: 12px; background: rgba(14, 20, 32, 0.78); border: 1px solid #c9a24a;
        border-radius: 8px; padding: 8px 12px; z-index: 2; }
      #panel a { color: #f3d58a; margin-right: 10px; text-decoration: none; }
      #panel a.on { color: #fff; font-weight: 600; text-decoration: underline; }
      #stats { position: absolute; right: 12px; top: 12px; background: rgba(0, 0, 0, 0.55); padding: 6px 10px; border-radius: 6px; z-index: 2; white-space: pre; font: 12px/1.3 ui-monospace, monospace; }
      .label { position: absolute; transform: translate(-50%, 0); color: #fff4d6; font: 600 11px/1.2 ui-monospace, monospace; text-shadow: 0 1px 2px #000, 0 0 6px #000; pointer-events: none; z-index: 1; white-space: nowrap; }
      body.clean #panel, body.clean #stats, body.clean .label { display: none; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="panel"></div>
    <div id="stats"></div>
    <script type="module" src="./tidecrown.ts"></script>
  </body>
</html>
